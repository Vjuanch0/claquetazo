<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0818">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Claquetazo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&family=Staatliches&display=swap">
<style>
/* Concepto: sala de cine a oscuras. Fondo morado casi negro, una sola claqueta (rayas) como firma,
   y los ploncitos (nubes de humo) como sistema de nota. La lectura va en serif, el resto en grotesca. */
:root{
  color-scheme:dark;
  --bg:#0f0818;
  --surface:#180c27;
  --surface-2:#221238;
  --line:#38225c;
  --nav-bg:#120a1f;
  --ink:#efe7fb;
  --ink-dim:#ab9ec8;
  --ink-faint:#8a7cae;
  --accent:#6d2fd6;
  --accent-hi:#8446ee;
  --lilac:#c1a5ff;
  --orchid:#e879f9;
  --plon-on:#d3bcff;
  --plon-off:#35205a;
  --v1:#ff5a78;
  --v2:#ff9a62;
  --v3:#c7b3ee;
  --v4:#9b86ff;
  --v5:#f08cff;
  --display:'Staatliches','Arial Narrow',Impact,sans-serif;
  --ui:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --lectura:'Newsreader',Georgia,'Times New Roman',serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);color:var(--ink);
  font:400 16px/1.5 var(--ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;
  -webkit-text-size-adjust:100%;
}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lilac);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#shell{max-width:1120px;margin:0 auto;padding-block:18px 120px}
#vista{min-width:0}

/* ---------- Navegación ---------- */
#nav{
  position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;
  background:var(--nav-bg);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));
}
.nav-i{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;font-size:12px;font-weight:500;color:var(--ink-dim);border-radius:8px}
.nav-i .ic{width:24px;height:24px}
.nav-i[aria-current="page"]{color:var(--lilac)}
.nav-i.mas .ic{width:36px;height:36px;padding:7px;border-radius:50%;background:var(--accent);color:#fff}
body.en-bienvenida #nav{display:none}
@media(min-width:860px){
  #nav{left:0;right:auto;top:0;bottom:0;width:92px;flex-direction:column;justify-content:flex-start;gap:8px;
    border-top:0;border-right:1px solid var(--line);
    padding:calc(24px + env(safe-area-inset-top,0px)) 8px 16px calc(8px + env(safe-area-inset-left,0px))}
  .nav-i{flex:none}
  #shell{padding-left:100px;padding-block:28px 60px}
  body.en-bienvenida #shell{padding-left:0}
}

/* ---------- Piezas comunes ---------- */
.logo{display:inline-flex;align-items:center;gap:10px;font-family:var(--display);font-size:1.7rem;letter-spacing:.05em;text-transform:uppercase;line-height:1}
.rayitas{display:inline-block;width:30px;height:16px;border-radius:2px;background:repeating-linear-gradient(115deg,var(--ink) 0 5px,var(--accent) 5px 10px)}
.cab{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.cuenta{color:var(--ink-dim);font-size:14px}
h1.pag{font-family:var(--display);font-weight:400;font-size:2.4rem;line-height:1;letter-spacing:.03em;margin:4px 0 18px;text-transform:uppercase}
h2.sec{font-family:var(--display);font-weight:400;font-size:1.5rem;letter-spacing:.04em;margin:28px 0 12px;text-transform:uppercase}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:6px;
  border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-weight:600}
.btn:hover{border-color:var(--lilac)}
.btn.prim{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.prim:hover{background:var(--accent-hi);border-color:var(--accent-hi)}
.btn.peligro{color:var(--v1)}
.btn.peligro.sure{background:var(--v1);color:#1a0610;border-color:var(--v1)}
.btn.grande{min-height:52px;padding:0 32px;font-size:1.05rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn .ic{width:20px;height:20px}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.in{width:100%;min-height:46px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.in:focus{border-color:var(--lilac);outline:none}
.in::placeholder{color:var(--ink-faint)}
textarea.in{resize:vertical;min-height:84px;line-height:1.5}
.aviso{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;padding:12px 14px;border:1px dashed var(--line);border-radius:6px;color:var(--ink-dim);font-size:14px}
.aviso .btn{min-height:36px;padding:0 12px;font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);z-index:40;
  max-width:min(92vw,420px);padding:10px 16px;border-radius:6px;background:var(--ink);color:var(--bg);font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(min-width:860px){#toast{bottom:28px}}

/* ---------- Ploncitos ---------- */
.plones{--pl:1.3em;display:inline-flex;gap:1px;vertical-align:middle}
.pl{position:relative;display:block;width:var(--pl);height:var(--pl)}
.pl svg{display:block;width:var(--pl);height:var(--pl)}
.pl-off{color:var(--plon-off)}
.pl-on{position:absolute;left:0;top:0;height:100%;overflow:hidden;color:var(--vc,var(--plon-on))}
.plones.chico{--pl:1.05em}
.plones.grande{--pl:2rem}

/* ---------- Bienvenida ---------- */
.bienvenida{position:fixed;inset:0;z-index:30;isolation:isolate;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;
  background:#0f0818;-webkit-tap-highlight-color:transparent;outline:none;user-select:none;-webkit-user-select:none;
  padding:max(12px,env(safe-area-inset-top,0px)) max(8px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.bv-fondo{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bv-fondo::before,.bv-fondo::after{content:"";position:absolute;width:95vmax;height:95vmax;border-radius:50%}
.bv-fondo::before{left:-48vmax;top:-52vmax;background:radial-gradient(circle,rgba(86,24,128,.55),rgba(40,10,70,0) 66%);animation:respira 18s ease-in-out infinite alternate}
.bv-fondo::after{right:-50vmax;bottom:-55vmax;background:radial-gradient(circle,rgba(70,20,112,.5),rgba(30,8,56,0) 66%);animation:respira 22s ease-in-out -6s infinite alternate-reverse}
@keyframes respira{from{transform:translate(0,0) scale(1)}to{transform:translate(4vmax,3vmax) scale(1.12)}}
.bv-humo{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.bv-luz{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);border-radius:50%;
  background:radial-gradient(circle,rgba(200,110,235,.4),rgba(130,80,220,.12) 45%,rgba(130,80,220,0) 70%);animation:parpadea var(--d) ease-in-out var(--r) infinite alternate}
@keyframes parpadea{from{opacity:.1;transform:translateY(0) scale(.9)}to{opacity:.55;transform:translateY(-22px) scale(1.12)}}
.bv-destello{position:absolute;left:50%;top:46%;width:140vmax;height:140vmax;margin:-70vmax 0 0 -70vmax;border-radius:50%;opacity:0;
  background:radial-gradient(circle,rgba(255,255,255,.45),rgba(170,140,240,.2) 18%,rgba(170,140,240,0) 45%);animation:destello .7s ease-out .62s both}
@keyframes destello{0%{opacity:0;transform:scale(.2)}25%{opacity:1}100%{opacity:0;transform:scale(1)}}
.bv-logo{display:block;flex:none;width:min(128vw,1040px);height:auto;max-width:none;max-height:86dvh;object-fit:contain;pointer-events:none;
  animation:entra .95s cubic-bezier(.2,1,.3,1) .15s both,flota 7s ease-in-out 1.3s infinite}
@keyframes entra{0%{opacity:0;transform:translateY(40px) scale(.5) rotate(-9deg)}50%{opacity:1;transform:translateY(-4px) scale(1.07) rotate(1.8deg)}72%{transform:scale(.98) rotate(-.7deg)}100%{opacity:1;transform:none}}
@keyframes flota{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-9px) rotate(.7deg)}}
.bv-carga{position:absolute;left:50%;bottom:max(22px,calc(env(safe-area-inset-bottom,0px) + 14px));width:min(150px,38vw);height:2px;margin-left:calc(min(150px,38vw) / -2);
  border-radius:2px;overflow:hidden;background:rgba(201,182,255,.12);opacity:0;animation:subefade .8s ease-out .9s forwards}
.bv-carga::after{content:"";display:block;height:100%;background:linear-gradient(90deg,#7c3aed,#e879f9);transform-origin:left center;transform:scaleX(0);animation:carga var(--dur,4s) linear forwards}
@keyframes carga{to{transform:scaleX(1)}}
@keyframes subefade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.bv-fondo::before,.bv-fondo::after,.bv-luz,.bv-destello,.bv-logo{animation:none!important}.bv-destello{display:none}.bv-luz{opacity:.3}.bv-carga{animation:none;opacity:1}.bv-carga::after{animation:none;transform:none;opacity:.5}}

/* ---------- Home ---------- */
.buscar{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:10px;margin-bottom:14px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:20px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px 9px;color:var(--ink-dim);font-weight:600;font-size:15px;white-space:nowrap}
.tab small{color:var(--ink-faint);margin-left:4px;font-weight:500}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--lilac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 14px}
.card{display:block;min-width:0}
.poster{position:relative;aspect-ratio:2/3;max-width:100%;background:var(--surface-2);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.poster img{display:block;width:100%;height:100%;object-fit:cover}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;gap:8px;padding:12px 12px 46px;
  background:linear-gradient(165deg,hsl(var(--h) 55% 24%),hsl(calc(var(--h) + 24) 60% 9%))}
.ph-cat{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);font-weight:600}
.ph-t{font-family:var(--display);font-size:1.6rem;line-height:1;text-transform:uppercase;overflow:hidden;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.nota-b{position:absolute;left:8px;bottom:8px;padding:1px 8px;border-radius:3px;background:var(--bg);border:1px solid var(--line);color:var(--vc);font-family:var(--display);font-size:1.3rem;line-height:1.3;letter-spacing:.04em}
.tag-ej,.tag-priv{position:absolute;top:8px;right:8px;padding:2px 6px;border-radius:3px;background:var(--bg);color:var(--ink-dim);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.tag-priv{right:auto;left:8px;color:var(--lilac)}
.card-b{padding-top:10px;display:grid;gap:3px}
.card-cat{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim)}
.card h3{margin:0;font-size:1rem;font-weight:600;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.card-s{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;margin-top:2px}
.palabra{font-family:var(--display);letter-spacing:.05em;text-transform:uppercase;color:var(--vc);font-size:1.05rem}
.card:hover h3{color:var(--lilac)}
.vacio-box{grid-column:1/-1;padding:36px 20px;border:1px dashed var(--line);border-radius:6px;text-align:left;color:var(--ink-dim);display:grid;gap:12px;justify-items:start}
.vacio-box strong{color:var(--ink);font-size:1.1rem}

/* ---------- Detalle ---------- */
.volver{display:inline-flex;align-items:center;gap:6px;margin-bottom:16px;color:var(--ink-dim);font-weight:500}
.volver .ic{width:20px;height:20px}
.d-cab{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;align-items:start}
.d-info{min-width:0;display:grid;gap:8px}
.d-info h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(1.9rem,7vw,3rem);line-height:1;letter-spacing:.03em;text-transform:uppercase;overflow-wrap:anywhere}
.meta{margin:0;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim)}
.chips-ro{display:flex;flex-wrap:wrap;gap:6px}
.chips-ro span{padding:3px 10px;border:1px solid var(--line);border-radius:999px;font-size:13px;color:var(--ink-dim)}
.desc{margin:0;color:var(--ink-dim);font-size:15px}
.vb{display:flex;flex-wrap:wrap;align-items:center;gap:8px 22px;margin:22px 0 6px;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.vb-num{font-family:var(--display);font-size:3.6rem;line-height:.9;color:var(--vc);letter-spacing:.02em}
.vb-de{color:var(--ink-faint);margin-left:4px;font-size:1rem}
.vb-med{display:grid;gap:2px}
.vb-pal{font-family:var(--display);font-size:1.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--vc);line-height:1.1}
.titular{margin:22px 0 4px;font-family:var(--lectura);font-style:italic;font-size:clamp(1.4rem,5vw,1.9rem);line-height:1.25;max-width:34ch;text-wrap:balance}
.prosa,.rte{font-family:var(--lectura);font-size:1.1875rem;line-height:1.7}
.prosa{max-width:65ch;margin-top:18px}
.prosa p,.rte p,.rte div{margin:0 0 1em}
.prosa h2,.rte h2{font-family:var(--ui);font-size:1.5rem;line-height:1.2;margin:1.4em 0 .5em;font-weight:700;text-wrap:balance}
.prosa h3,.rte h3{font-family:var(--ui);font-size:1.2rem;margin:1.2em 0 .4em;font-weight:700}
.prosa blockquote,.rte blockquote{margin:1.2em 0;padding:2px 0 2px 18px;border-left:3px solid var(--accent-hi);color:var(--ink-dim);font-style:italic}
.prosa ul,.prosa ol,.rte ul,.rte ol{padding-left:1.4em;margin:0 0 1em}
.vacio{color:var(--ink-faint);font-style:italic}
.lectura-t{margin:6px 0 0;font-size:13px;color:var(--ink-faint)}
.acciones{display:flex;flex-wrap:wrap;gap:10px;margin:26px 0 8px}
.coms{margin-top:34px;max-width:65ch}
.coms ul{list-style:none;padding:0;margin:0 0 20px;display:grid;gap:12px}
.coms li{padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.coms li p{margin:0 0 8px;font-family:var(--lectura);font-size:1.1rem;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.coms footer{display:flex;align-items:center;justify-content:space-between;color:var(--ink-faint);font-size:13px}
.link-b{background:none;border:0;padding:6px 0;color:var(--ink-faint);text-decoration:underline;font-size:13px}
.contador{font-size:13px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.contador.ok{color:var(--v4)}
@media(min-width:720px){.d-cab{grid-template-columns:220px minmax(0,1fr);gap:28px}}

/* ---------- Editor ---------- */
.form{max-width:680px;display:grid;gap:22px}
.campo{display:grid;gap:8px;min-width:0}
.campo>label,.campo>.lbl{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim)}
.ayuda{margin:0;font-size:13px;color:var(--ink-faint)}
.foto-ed{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;align-items:center}
.foto-ed .poster{width:120px}
.foto-ed div.btns{display:flex;flex-wrap:wrap;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:38px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--ink-dim);font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.gen-nuevo{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.nota-ed{display:grid;gap:10px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.nota-prev{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px}
.nota-prev .vb-num{font-size:3rem}
.nota-ctrl{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:10px;align-items:center}
.nota-ctrl .btn{padding:0;min-height:40px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:32px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--v1),var(--v3) 50%,var(--v5))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-10px;border-radius:50%;background:var(--ink);border:4px solid var(--accent)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--v1),var(--v3) 50%,var(--v5))}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--ink);border:4px solid var(--accent)}
.tbar{display:flex;flex-wrap:wrap;gap:6px}
.tb{min-width:42px;height:42px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-weight:700}
.tb:hover{border-color:var(--lilac)}
.rte{min-height:280px;padding:16px;border:1px solid var(--line);border-radius:6px;background:var(--surface);overflow-wrap:anywhere}
.rte:focus{outline:none;border-color:var(--lilac)}
.rte:empty::before{content:attr(data-ph);color:var(--ink-faint)}
.error{margin:0;color:var(--v1);font-weight:600}
.barra-g{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* ---------- Rankings ---------- */
.sub{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filtros{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px;max-width:520px}
.rk{list-style:none;margin:0;padding:0;display:grid;gap:10px;max-width:760px}
.rk li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.rk-main{display:grid;grid-template-columns:40px 52px minmax(0,1fr);gap:12px;align-items:center;min-width:0}
.rk-n{font-family:var(--display);font-size:1.9rem;line-height:1;color:var(--lilac);text-align:center;font-variant-numeric:tabular-nums}
.rk-th{width:52px;aspect-ratio:2/3;border-radius:3px;overflow:hidden;position:relative;background:var(--surface-2)}
.rk-th img{width:100%;height:100%;object-fit:cover;display:block}
.rk-th .ph{padding:4px}
.rk-th .ph-cat,.rk-th .ph-t{display:none}
.rk-t{min-width:0;display:grid;gap:2px}
.rk-t b{font-weight:600;overflow-wrap:anywhere;line-height:1.25}
.rk-t small{color:var(--ink-dim);font-size:13px;overflow-wrap:anywhere}
.rk-s{display:flex;align-items:center;flex-wrap:wrap;gap:2px 8px}
.rk-ctrl{display:flex;gap:4px}
.ib{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--ink-dim)}

<script>
(function () {
'use strict';

/* =====================================================================
   1. CONFIGURACIÓN  (aquí cambias categorías, géneros y reglas)
   ===================================================================== */
const MIN_COMENTARIO = 150;   // caracteres mínimos para comentar
const TOPE_TOP = 50;          // tamaño máximo de los rankings

// La nube (Supabase). La clave "publishable" está hecha para verse en el código; no es secreta.
const SUPABASE_URL = 'https://kmrmhktllsjsqfpbmjka.supabase.co';
const SUPABASE_KEY = 'sb_publishable_uAnYR3p8A7l4hOxKq6Li_A_Wls99dM_';
const BUCKET = 'fotos';

const CATEGORIAS = [
  { id: 'cine',   nombre: 'Cine' },
  { id: 'musica', nombre: 'Música' },
  { id: 'libros', nombre: 'Libros' },
  { id: 'futbol', nombre: 'Fútbol' },
  { id: 'otros',  nombre: 'Otros' }
];

const GENEROS = {
  cine:   ['Comedia', 'Comedia romántica', 'Comedia de acción', 'Acción', 'Horror', 'Slasher', 'Suspenso', 'Drama', 'Ciencia ficción', 'Animación', 'Documental', 'Crimen', 'Fantasía', 'Musical'],
  musica: ['Rock', 'Pop', 'Hip hop', 'Rap', 'Reguetón', 'Salsa', 'Vallenato', 'Electrónica', 'Metal', 'Indie', 'Baladas', 'Concierto', 'Videoclip'],
  libros: ['Novela', 'Ficción', 'Ensayo', 'Terror', 'Fantasía', 'Ciencia ficción', 'Biografía', 'Poesía', 'Historia', 'Misterio', 'Cómic'],
  futbol: ['Liga', 'Copa', 'Champions', 'Selección', 'Clásico', 'Eliminatoria', 'Mundial'],
  otros:  ['Serie', 'Videoclip', 'Concierto', 'Documental', 'Videojuego', 'Podcast']
};

// La escala de notas: una sola para todo.
const NIVELES = [null,
  { nombre: 're paila',  color: 'var(--v1)' },
  { nombre: 'paila',     color: 'var(--v2)' },
  { nombre: 'suave',     color: 'var(--v3)' },
  { nombre: 'melo',      color: 'var(--v4)' },
  { nombre: 're makia',  color: 'var(--v5)' }
];

/* =====================================================================
   2. UTILIDADES
   ===================================================================== */
const $ = (s, el) => (el || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const nuevoId = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
  : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); });
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const catNombre = id => (CATEGORIAS.find(c => c.id === id) || { nombre: 'Otros' }).nombre;
const redondear = n => Math.round(n * 10) / 10;

function fmtFecha(s) {
  if (!s) return '';
  const p = s.split('-');
  if (p.length < 3) return p[0];
  return (+p[2]) + ' ' + (MESES[(+p[1]) - 1] || '') + ' ' + p[0];
}
function fmtFechaMs(ms) {
  const d = new Date(ms);
  return d.getDate() + ' ' + MESES[d.getMonth()] + ' ' + d.getFullYear();
}
function hash(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; }

// Nota (1.0 a 5.0) -> nivel (1 a 5). 4.9 sigue siendo "melo"; solo 5.0 es "re makia".
function nivel(nota) { return NIVELES[Math.max(1, Math.min(5, Math.floor(nota + 1e-9)))]; }

// Dibuja los 5 ploncitos. Cada uno se llena según lo que falte de la nota (ej: 4.7 = 4 llenos + uno al 70%).
function plones(nota, clase) {
  const nv = nivel(nota);
  let h = '<span class="plones ' + (clase || '') + '" style="--vc:' + nv.color + '" role="img" aria-label="' + nota.toFixed(1) + ' de 5 ploncitos">';
  for (let i = 0; i < 5; i++) {
    const f = Math.max(0, Math.min(1, nota - i));
    h += '<span class="pl"><svg class="pl-off" viewBox="0 0 24 24"><use href="#plon"/></svg>' +
         '<span class="pl-on" style="width:' + (f * 100).toFixed(0) + '%"><svg viewBox="0 0 24 24"><use href="#plon"/></svg></span></span>';
  }
  return h + '</span>';
}

// Limpia el HTML de las reseñas: solo deja formato básico y quita todo lo demás.
const PERMITIDAS = new Set(['P', 'BR', 'B', 'STRONG', 'I', 'EM', 'U', 'H2', 'H3', 'BLOCKQUOTE', 'UL', 'OL', 'LI']);
function limpiar(html) {
  const doc = new DOMParser().parseFromString('<body>' + (html || '') + '</body>', 'text/html');
  (function recorrer(nodo) {
    Array.from(nodo.childNodes).forEach(function (h) {
      if (h.nodeType === 3) return;
      if (h.nodeType !== 1) { h.remove(); return; }
      recorrer(h);
      if (PERMITIDAS.has(h.tagName)) {
        Array.from(h.attributes).forEach(a => h.removeAttribute(a.name));
      } else if (['SCRIPT', 'STYLE', 'IFRAME', 'OBJECT', 'EMBED', 'LINK', 'META'].indexOf(h.tagName) >= 0) {
        h.remove();
      } else if (h.tagName === 'DIV') {
        const p = doc.createElement('p');
        while (h.firstChild) p.appendChild(h.firstChild);
        h.replaceWith(p);
      } else {
        while (h.firstChild) h.parentNode.insertBefore(h.firstChild, h);
        h.remove();
      }
    });
  })(doc.body);
  return doc.body.innerHTML.trim();
}
function textoPlano(html) { const d = document.createElement('div'); d.innerHTML = limpiar(html); return d.textContent || ''; }

/* =====================================================================
   3. DATOS: la nube (Supabase) y una copia en este aparato
      Todo vive en Supabase. La copia local sirve para abrir rápido y sin internet.
   ===================================================================== */
function abrirIDB(nombre, almacen, clave) {
  return new Promise(function (ok) {
    try {
      const rq = indexedDB.open(nombre, 1);
      rq.onupgradeneeded = function () { rq.result.createObjectStore(almacen, { keyPath: clave }); };
      rq.onerror = rq.onblocked = function () { ok(null); };
      rq.onsuccess = function () {
        const db = rq.result;
        const tx = function (modo) { return db.transaction(almacen, modo).objectStore(almacen); };
        const pedir = function (f) {
          return new Promise(function (r) {
            try { const q = f(); q.onsuccess = function () { r(q.result); }; q.onerror = function () { r(null); }; } catch (e) { r(null); }
          });
        };
        ok({
          todos: function () { return pedir(function () { return tx('readonly').getAll(); }).then(function (x) { return x || []; }); },
          leer: function (k) { return pedir(function () { return tx('readonly').get(k); }); },
          poner: function (v) { try { tx('readwrite').put(v); } catch (e) { /* sin copia */ } },
          borrar: function (k) { try { tx('readwrite').delete(k); } catch (e) { /* nada */ } }
        });
      };
    } catch (e) { ok(null); }
  });
}

const Copia = {
  db: null,
  async abrir() { this.db = await abrirIDB('claquetazo-nube', 'copia', 'k'); },
  async leer(k) { if (!this.db) return null; const r = await this.db.leer(k); return r ? r.v : null; },
  escribir(k, v) { if (this.db) this.db.poner({ k: k, v: v }); }
};

// Lo que guardaba la primera versión de la app en este aparato (sirve para pasarlo a la nube).
const Local = {
  db: null,
  async abrir() { if (!this.db) this.db = await abrirIDB('claquetazo', 'items', 'id'); return this.db; },
  async todos() { const d = await this.abrir(); return d ? d.todos() : []; },
  async borrar(id) { const d = await this.abrir(); if (d) d.borrar(id); }
};

let sb = null;   // el cliente de Supabase
function iniciarCliente() {
  try { if (window.supabase && window.supabase.createClient) sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch (e) { sb = null; }
  return !!sb;
}
function urlFoto(path) {
  if (!path || !sb) return null;
  try { return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl; } catch (e) { return null; }
}

// Asegura que cada reseña tenga todos sus campos bien.
function normalizar(r) {
  r = r || {};
  const cat = CATEGORIAS.some(c => c.id === r.categoria) ? r.categoria : 'otros';
  let nota = Number(r.nota); if (!isFinite(nota)) nota = 3;
  nota = redondear(Math.max(1, Math.min(5, nota)));
  const https = s => (typeof s === 'string' && /^https:\/\//.test(s)) ? s : null;
  const ruta = s => (typeof s === 'string' && s) ? s : null;
  return {
    id: (typeof r.id === 'string' && /^[a-z0-9-]+$/i.test(r.id)) ? r.id : nuevoId(),
    titulo: String(r.titulo || 'Sin título').slice(0, 200),
    categoria: cat,
    generos: Array.isArray(r.generos) ? r.generos.map(g => String(g).slice(0, 30)).slice(0, 12) : [],
    fecha: /^\d{4}(-\d{2}-\d{2})?$/.test(r.fecha || '') ? r.fecha : '',
    descripcion: String(r.descripcion || '').slice(0, 500),
    nota: nota,
    veredicto: String(r.veredicto || '').slice(0, 120),
    resenia: typeof r.resenia === 'string' ? r.resenia : '',
    foto: https(r.foto), thumb: https(r.thumb), fotoPath: ruta(r.fotoPath), thumbPath: ruta(r.thumbPath),
    publica: !!r.publica,
    creado: Number(r.creado) || Date.now(),
    fav: Number.isInteger(r.fav) ? r.fav : null,
    comentarios: Array.isArray(r.comentarios) ? r.comentarios.filter(c => c && typeof c.texto === 'string').map(c => ({
      id: String(c.id || nuevoId()).replace(/[^a-z0-9-]/gi, '') || nuevoId(),
      texto: c.texto.slice(0, 5000),
      fecha: Number(c.fecha) || Date.now()
    })) : []
  };
}

// Una fila de la tabla "reviews" -> una reseña de la app
function desdeFila(f) {
  return normalizar({
    id: f.id, titulo: f.titulo, categoria: f.categoria, generos: f.generos, fecha: f.fecha, descripcion: f.descripcion,
    nota: f.nota, veredicto: f.veredicto, resenia: f.resenia, fotoPath: f.foto_path, thumbPath: f.thumb_path,
    foto: urlFoto(f.foto_path), thumb: urlFoto(f.thumb_path), fav: f.fav, publica: f.publica, creado: Date.parse(f.created_at)
  });
}

/* =====================================================================
   4. ESTADO
   ===================================================================== */
const estado = {
  items: [], sesion: null, cargando: true, sinConexion: false, iniciado: false, guardando: false, locales: 0,
  cat: 'todo', q: '', orden: 'recientes', topTab: 'favoritas', topCat: 'todo', topGen: 'todos', ed: null
};
const porId = id => estado.items.find(x => x.id === id);
const claveCopia = () => 'items-' + (estado.sesion ? estado.sesion.id : 'anon');

async function cargarItems() {
  if (!sb) throw new Error('sin cliente');
  const r = await sb.from('reviews').select('*').order('created_at', { ascending: false });
  if (r.error) throw r.error;
  estado.items = r.data.map(desdeFila);
  estado.sinConexion = false;
  Copia.escribir(claveCopia(), estado.items);
}

async function refrescar() {
  estado.cargando = true;
  try { await cargarItems(); }
  catch (e) {
    console.error(e);
    estado.sinConexion = true;
    if (!estado.items.length) { const c = await Copia.leer(claveCopia()); if (c) estado.items = c.map(normalizar); }
  }
  estado.cargando = false;
}

async function cargarComentarios(id) {
  const it = porId(id); if (!it || !sb) return;
  const r = await sb.from('comments').select('*').eq('review_id', id).order('created_at', { ascending: true });
  if (r.error) throw r.error;
  it.comentarios = r.data.map(c => ({ id: c.id, texto: c.texto, fecha: Date.parse(c.created_at) }));
}

/* =====================================================================
   5. PIEZAS DE PANTALLA
   ===================================================================== */
function portada(it, grande) {
  const src = grande ? (it.foto || it.thumb) : (it.thumb || it.foto);
  if (src) return '<img src="' + esc(src) + '" alt="" loading="lazy">';
  const h = 250 + (hash(it.titulo) % 80);
  return '<div class="ph" style="--h:' + h + '"><span class="ph-cat">' + esc(catNombre(it.categoria)) + '</span><span class="ph-t">' + esc(it.titulo) + '</span></div>';
}

function tarjeta(it) {
  const nv = nivel(it.nota);
  const anio = it.fecha ? it.fecha.slice(0, 4) : '';
  return '<a class="card" href="#r-' + it.id + '" style="--vc:' + nv.color + '">' +
    '<div class="poster">' + portada(it) + '<span class="nota-b">' + it.nota.toFixed(1) + '</span>' + (!it.publica ? '<span class="tag-priv">Privada</span>' : '') + '</div>' +
    '<div class="card-b"><span class="card-cat">' + esc(catNombre(it.categoria)) + (anio ? ' · ' + esc(anio) : '') + '</span>' +
    '<h3>' + esc(it.titulo) + '</h3>' +
    '<div class="card-s">' + plones(it.nota, 'chico') + '<span class="palabra">' + nv.nombre + '</span></div></div></a>';
}

function filtrados() {
  const q = norm(estado.q.trim());
  const l = estado.items.filter(function (it) {
    if (estado.cat !== 'todo' && it.categoria !== estado.cat) return false;
    if (!q) return true;
    return norm([it.titulo, catNombre(it.categoria), it.generos.join(' '), it.descripcion, it.veredicto].join(' ')).indexOf(q) >= 0;
  });
  const o = estado.orden;
  l.sort(function (a, b) {
    if (o === 'mejor') return b.nota - a.nota || b.creado - a.creado;
    if (o === 'peor') return a.nota - b.nota || b.creado - a.creado;
    if (o === 'az') return a.titulo.localeCompare(b.titulo, 'es');
    return b.creado - a.creado;
  });
  return l;
}

function gridHTML() {
  const l = filtrados();
  if (l.length) return l.map(tarjeta).join('');
  if (estado.cargando && !estado.items.length) return '<div class="vacio-box"><strong>Cargando reseñas…</strong></div>';
  if (!estado.items.length) {
    if (estado.sinConexion) return '<div class="vacio-box"><strong>Sin conexión.</strong><span>Todavía no hay una copia guardada en este aparato. Conéctate a internet para ver las reseñas.</span><button class="btn prim" data-action="reintentar">Reintentar</button></div>';
    return estado.sesion
      ? '<div class="vacio-box"><strong>Aquí van a vivir tus reseñas.</strong><span>Agrega la primera: una peli, un álbum, un libro o un partido.</span><a class="btn prim" href="#agregar">Agregar reseña</a></div>'
      : '<div class="vacio-box"><strong>Todavía no hay reseñas públicas.</strong><span>Vuelve pronto.</span></div>';
  }
  return '<div class="vacio-box"><strong>No hay nada por aquí.</strong><span>' + (estado.q ? 'Ninguna reseña coincide con «' + esc(estado.q) + '».' : 'Todavía no hay reseñas en esta categoría.') + '</span></div>';
}
function pintarGrid() { const g = $('#grid'); if (g) g.innerHTML = gridHTML(); }

/* ---------- Bienvenida ---------- */
// Tiempo máximo en la bienvenida: si no se toca la pantalla, entra sola.
const DURACION_BIENVENIDA = 4000;
function vistaBienvenida() {
  const al = (a, b) => (a + Math.random() * (b - a)).toFixed(0);
  let luces = '';
  for (let i = 0; i < 12; i++) luces += '<span class="bv-luz" style="--x:' + al(0, 95) + '%;--y:' + al(3, 92) + '%;--s:' + al(24, 100) + 'px;--d:' + (4 + Math.random() * 6).toFixed(1) + 's;--r:-' + (Math.random() * 8).toFixed(1) + 's"></span>';
  return '<section class="bienvenida" data-action="empezar" role="button" tabindex="0" aria-label="Entrar a Claquetazo. Toca la pantalla">' +
    '<div class="bv-fondo" aria-hidden="true">' + luces + '<span class="bv-destello"></span></div>' +
    '<canvas class="bv-humo" aria-hidden="true"></canvas>' +
    '<h1 class="vh">Claquetazo. Luces, cámara y sin palabras</h1>' +
    '<img class="bv-logo" src="img/logo-1200.webp" srcset="img/logo-720.webp 720w, img/logo-1200.webp 1200w" sizes="(max-width: 700px) 128vw, 1040px" width="1200" height="1235" alt="Claquetazo, luces, cámara y sin palabras" decoding="async" fetchpriority="high">' +
    '<div class="bv-carga" aria-hidden="true" style="--dur:' + (DURACION_BIENVENIDA / 1000) + 's"></div></section>';
}

// Humo de la bienvenida: "caladas" que salen de abajo, se abren, suben y se disuelven.
let bvTimer = null, bvRaf = 0, bvLimpiar = null;
function detenerBienvenida() {
  if (bvTimer) { clearTimeout(bvTimer); bvTimer = null; }
  if (bvRaf) { cancelAnimationFrame(bvRaf); bvRaf = 0; }
  if (bvLimpiar) { try { bvLimpiar(); } catch (e) {} bvLimpiar = null; }
}
function entrarApp() {
  if (!document.querySelector('.bienvenida')) return;
  detenerBienvenida();
  location.hash = '#inicio';
}
function iniciarHumo(cv) {
  try {
    const ctx = cv.getContext && cv.getContext('2d'); if (!ctx) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    let W = 0, H = 0;
    const medir = function () {
      W = cv.clientWidth || window.innerWidth; H = cv.clientHeight || window.innerHeight;
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    medir(); window.addEventListener('resize', medir);
    // Una bolita de humo suave, dibujada una sola vez y reutilizada.
    const spr = document.createElement('canvas'); spr.width = spr.height = 128;
    const sc = spr.getContext('2d'), g = sc.createRadialGradient(64, 64, 0, 64, 64, 64);
    g.addColorStop(0, 'rgba(232,220,255,.95)'); g.addColorStop(.45, 'rgba(196,170,255,.5)'); g.addColorStop(1, 'rgba(160,120,240,0)');
    sc.fillStyle = g; sc.fillRect(0, 0, 128, 128);
    const bolas = []; let t0 = performance.now(), ultima = t0, proxima = t0;
    const R = function (a, b) { return a + Math.random() * (b - a); };
    function calada() {
      const lado = Math.random(), x0 = lado < .33 ? R(.02, .2) * W : lado < .66 ? R(.8, .98) * W : R(.3, .7) * W;
      const dir = x0 < W / 2 ? 1 : -1, y0 = H * R(.78, 1.02), esc = Math.min(1, Math.max(.55, W / 700));
      const n = 30;
      for (let i = 0; i < n; i++) bolas.push({
        nac: t0 + i * 38 + R(0, 30), vida: R(5000, 8000), x: x0 + R(-14, 14), y: y0 + R(-10, 10),
        vx: dir * R(8, 26) * esc, vy: -R(30, 62) * esc, r0: R(9, 20) * esc, r1: R(55, 125) * esc,
        fase: R(0, 6.28), onda: R(10, 26), a: R(.1, .19)
      });
    }
    function cuadro(ahora) {
      bvRaf = requestAnimationFrame(cuadro);
      const dt = Math.min(.05, (ahora - ultima) / 1000); ultima = ahora;
      if (ahora >= proxima) { calada(); proxima = ahora + R(1100, 1900); }
      ctx.clearRect(0, 0, W, H);
      for (let i = bolas.length - 1; i >= 0; i--) {
        const b = bolas[i], e = ahora - b.nac;
        if (e < 0) continue;
        if (e > b.vida) { bolas.splice(i, 1); continue; }
        const k = e / b.vida;
        b.x += (b.vx + Math.sin(b.fase + e / 900) * b.onda) * dt; b.y += b.vy * dt; b.vy *= (1 - .18 * dt);
        const r = b.r0 + (b.r1 - b.r0) * (1 - Math.pow(1 - k, 2));
        const alfa = b.a * Math.min(1, k / .12) * Math.pow(1 - k, 1.3);
        ctx.globalAlpha = alfa; ctx.drawImage(spr, b.x - r, b.y - r, r * 2, r * 2);
      }
      ctx.globalAlpha = 1;
    }
    calada(); bvRaf = requestAnimationFrame(cuadro);
    bvLimpiar = function () { window.removeEventListener('resize', medir); };
  } catch (e) { /* sin humo, la bienvenida sigue funcionando */ }
}
function iniciarBienvenida() {
  detenerBienvenida();
  const sec = document.querySelector('.bienvenida'); if (!sec) return;
  bvTimer = setTimeout(entrarApp, DURACION_BIENVENIDA);
  const quieto = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cv = sec.querySelector('canvas.bv-humo');
  if (cv && !quieto) iniciarHumo(cv);
  try { sec.focus({ preventScroll: true }); } catch (e) {}
}

/* ---------- Rankings ---------- */
function listaFavs() { return estado.items.filter(i => i.fav != null).sort((a, b) => a.fav - b.fav); }
function listaTop(modo) {
  const l = estado.items.filter(it => (estado.topCat === 'todo' || it.categoria === estado.topCat) && (estado.topGen === 'todos' || it.generos.indexOf(estado.topGen) >= 0));
  const desempate = (a, b) => (a.fav == null ? 1e9 : a.fav) - (b.fav == null ? 1e9 : b.fav) || a.creado - b.creado;
  l.sort(modo === 'mejores' ? (a, b) => b.nota - a.nota || desempate(a, b) : (a, b) => a.nota - b.nota || desempate(a, b));
  return l.slice(0, TOPE_TOP);
}
function filaRank(it, pos, ctrl) {
  const nv = nivel(it.nota);
  return '<li style="--vc:' + nv.color + '"><a class="rk-main" href="#r-' + it.id + '"><span class="rk-n">' + pos + '</span><span class="rk-th">' + portada(it) + '</span>' +
    '<span class="rk-t"><b>' + esc(it.titulo) + '</b><small>' + esc(catNombre(it.categoria)) + (it.generos.length ? ' · ' + esc(it.generos.join(', ')) : '') + '</small>' +
    '<span class="rk-s">' + plones(it.nota, 'chico') + '<span class="palabra">' + it.nota.toFixed(1) + ' · ' + nv.nombre + '</span></span></span></a>' + (ctrl || '') + '</li>';
}
const FLECHA_ARRIBA = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>';
const FLECHA_ABAJO = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
const EQUIS = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const MAS = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';

function vistaTop() {
  const t = estado.topTab, dueno = !!estado.sesion;
  const sub = [['favoritas', 'Favoritas'], ['mejores', 'Mejores'], ['peores', 'Peores']]
    .map(x => '<button class="chip" aria-pressed="' + (t === x[0]) + '" data-action="top-tab" data-tab="' + x[0] + '">' + x[1] + '</button>').join('');
  let cuerpo = '';
  if (t === 'favoritas') {
    const f = listaFavs();
    cuerpo = '<p class="ayuda" style="margin-bottom:14px">' + (dueno ? 'Tu orden manual, hasta ' + TOPE_TOP + ' puestos. Ahora tienes ' + f.length + '.' : 'Las favoritas de Juancho, en su orden.') + '</p>';
    if (!f.length) {
      cuerpo += '<div class="vacio-box"><strong>Todavía no hay favoritas.</strong><span>' + (dueno ? 'Abre una reseña y toca «Agregar a favoritas», o elige una de las candidatas de abajo.' : 'Vuelve pronto.') + '</span></div>';
    } else {
      cuerpo += '<ol class="rk">' + f.map((it, i) => filaRank(it, i + 1, dueno
        ? '<div class="rk-ctrl"><button class="ib" data-action="fav-up" data-id="' + it.id + '" aria-label="Subir un puesto"' + (i === 0 ? ' disabled' : '') + '>' + FLECHA_ARRIBA + '</button>' +
          '<button class="ib" data-action="fav-down" data-id="' + it.id + '" aria-label="Bajar un puesto"' + (i === f.length - 1 ? ' disabled' : '') + '>' + FLECHA_ABAJO + '</button>' +
          '<button class="ib" data-action="fav-quitar" data-id="' + it.id + '" aria-label="Quitar de favoritas">' + EQUIS + '</button></div>'
        : '')).join('') + '</ol>';
    }
    const cand = dueno ? estado.items.filter(i => i.fav == null && i.nota >= 4.5).sort((a, b) => b.nota - a.nota).slice(0, 10) : [];
    if (cand.length) {
      cuerpo += '<h2 class="sec">Candidatas</h2><p class="ayuda" style="margin-bottom:12px">Reseñas con 4.5 o más que todavía no están en tu top.</p><ol class="rk">' +
        cand.map(it => filaRank(it, '·', '<div class="rk-ctrl"><button class="ib" data-action="fav-add" data-id="' + it.id + '" aria-label="Agregar a favoritas">' + MAS + '</button></div>')).join('') + '</ol>';
    }
  } else {
    const delCat = estado.items.filter(it => estado.topCat === 'todo' || it.categoria === estado.topCat);
    const gens = Array.from(new Set(delCat.reduce((a, it) => a.concat(it.generos), []))).sort((a, b) => a.localeCompare(b, 'es'));
    const ocat = [['todo', 'Todas las categorías']].concat(CATEGORIAS.map(c => [c.id, c.nombre]))
      .map(c => '<option value="' + c[0] + '"' + (estado.topCat === c[0] ? ' selected' : '') + '>' + c[1] + '</option>').join('');
    const ogen = '<option value="todos">Todos los géneros</option>' + gens.map(g => '<option value="' + esc(g) + '"' + (estado.topGen === g ? ' selected' : '') + '>' + esc(g) + '</option>').join('');
    const l = listaTop(t);
    cuerpo = '<div class="filtros"><div><label class="vh" for="top-cat">Categoría</label><select id="top-cat" class="in">' + ocat + '</select></div>' +
      '<div><label class="vh" for="top-gen">Género</label><select id="top-gen" class="in">' + ogen + '</select></div></div>' +
      (l.length ? '<ol class="rk">' + l.map((it, i) => filaRank(it, i + 1, '')).join('') + '</ol>'
        : '<div class="vacio-box"><strong>Nada para mostrar.</strong><span>Prueba con otra categoría o género.</span></div>');
  }
  return '<h1 class="pag">Rankings</h1><div class="sub" role="group" aria-label="Tipo de ranking">' + sub + '</div>' + cuerpo;
}

    ? '<div class="ajuste"><h2>Respaldo</h2><p>Descarga un archivo con el texto de tus reseñas por si algún día lo necesitas. Las fotos no van en el archivo, se quedan en la nube. Importar agrega las reseñas del archivo como nuevas.</p>' +
      '<div class="barra-g"><button class="btn" data-action="exportar">Descargar respaldo</button><label class="btn" for="f-importar">Importar respaldo</label><input class="vh" type="file" id="f-importar" accept="application/json,.json"></div>' +
      (enMarco ? '<p class="ayuda">En esta vista previa la descarga no funciona. En la app instalada o abierta en el navegador sí.</p>' : '') + '</div>'
    : '';
  return '<h1 class="pag">Ajustes</h1>' + cuenta + migrar + respaldo;
}

/* =====================================================================
   6. RUTAS: según el # de la dirección se dibuja una pantalla u otra
   ===================================================================== */
function render(cambioDeRuta) {
  const h = location.hash.slice(1);
  if (!h && !cambioDeRuta && document.querySelector('.bienvenida')) return;   // la bienvenida no se repite sola
  detenerBienvenida();
  const rutaEditor = h === 'agregar' || h.indexOf('editar-') === 0;
  if (rutaEditor && estado.iniciado && !estado.sesion) { location.hash = '#entrar'; return; }
  if (h === 'entrar' && estado.sesion) { location.hash = '#ajustes'; return; }
  let html = '', sec = '';
  document.body.classList.toggle('en-bienvenida', !h);
  if (!h) { html = vistaBienvenida(); }
  else if (h === 'inicio') { html = vistaInicio(); sec = 'inicio'; }
  else if (rutaEditor && !estado.iniciado) { html = '<p class="ayuda">Cargando…</p>'; sec = 'agregar'; }
  else if (h === 'agregar') { if (cambioDeRuta || !estado.ed) iniciarEditor(null); html = vistaEditor(); sec = 'agregar'; }
  else if (h.indexOf('editar-') === 0) { if (cambioDeRuta || !estado.ed) iniciarEditor(h.slice(7)); html = estado.ed && estado.ed.base ? vistaEditor() : vistaDetalle(''); sec = 'agregar'; }
  else if (h === 'top') { html = vistaTop(); sec = 'top'; }
  else if (h === 'ajustes') { html = vistaAjustes(); sec = 'ajustes'; }
  else if (h === 'entrar') { html = vistaEntrar(); sec = 'ajustes'; }
  else if (h.indexOf('r-') === 0) { html = vistaDetalle(h.slice(2)); sec = 'inicio'; }
  else { location.hash = '#inicio'; return; }
  $('#vista').innerHTML = html;
  document.querySelectorAll('#nav .nav-i').forEach(a => {
    if (a.dataset.sec === sec) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  if (cambioDeRuta) window.scrollTo(0, 0);
  if (!h) iniciarBienvenida();
  if (h.indexOf('r-') === 0 && sb && porId(h.slice(2))) {
    const rid = h.slice(2);
    cargarComentarios(rid).then(function () { if (location.hash === '#r-' + rid) pintarComentarios(porId(rid)); }).catch(function () { /* se queda sin comentarios */ });
  }
}

// Vuelve a dibujar sin molestar si la persona está escribiendo.
function renderSuave() {
  const h = location.hash.slice(1);
  if (!h) return;
  if (h === 'agregar' || h.indexOf('editar-') === 0) { if (estado.iniciado && !estado.sesion) render(true); return; }
  const a = document.activeElement;
  if (a && (a.id === 'com-texto' || a.id === 'login-email' || a.id === 'login-clave')) return;
  render(false);
}

let temporizador;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(temporizador);
  temporizador = setTimeout(() => t.classList.remove('on'), 2800);
}

/* =====================================================================
   7. ACCIONES (todo lo que pasa al tocar algo)
   ===================================================================== */
// Corre una acción que habla con la nube. Si falla, avisa y vuelve a traer lo que hay guardado.
async function seguro(fn, msgError) {
  try { await fn(); renderSuave(); return true; }
  catch (e) {
    console.error(e);
    toast(msgError || 'No se pudo guardar. Revisa tu internet e intenta otra vez.');
    try { await cargarItems(); } catch (e2) { estado.sinConexion = true; }
    renderSuave();
    return false;
  }
}

/* ---------- Favoritas ---------- */
async function sincronizarFavs(cambios) {
  const rs = await Promise.all(cambios.map(c => sb.from('reviews').update({ fav: c[1] }).eq('id', c[0])));
  const mal = rs.find(r => r.error);
  if (mal) throw mal.error;
  Copia.escribir(claveCopia(), estado.items);
}
async function renumerarFavs() {
  const cambios = [];
  listaFavs().forEach((it, i) => { if (it.fav !== i + 1) { it.fav = i + 1; cambios.push([it.id, it.fav]); } });
  if (cambios.length) await sincronizarFavs(cambios);
}
async function agregarFav(id) {
  const it = porId(id), l = listaFavs();
  if (!it || it.fav != null) return false;
  if (l.length >= TOPE_TOP) { toast('Tu top ' + TOPE_TOP + ' está lleno. Quita una favorita primero.'); return false; }
  it.fav = l.length + 1;
  await sincronizarFavs([[id, it.fav]]);
  return true;
}
async function quitarFav(id) {
  const it = porId(id); if (!it) return;
  it.fav = null;
  await sincronizarFavs([[id, null]]);
  await renumerarFavs();
}
async function moverFav(id, dir) {
  const l = listaFavs(), i = l.findIndex(x => x.id === id), j = i + dir;
  if (i < 0 || j < 0 || j >= l.length) return;
  const a = l[i], b = l[j], t = a.fav;
  a.fav = b.fav; b.fav = t;
  await sincronizarFavs([[a.id, a.fav], [b.id, b.fav]]);
}

async function borrarItem(id) {
  const it = porId(id); if (!it) return;
  const r = await sb.from('reviews').delete().eq('id', id);
  if (r.error) throw r.error;
  const rutas = [it.fotoPath, it.thumbPath].filter(Boolean);
  if (rutas.length) sb.storage.from(BUCKET).remove(rutas);
  estado.items = estado.items.filter(x => x.id !== id);
  await renumerarFavs();
}

/* ---------- Fotos ---------- */
function cargarImagen(archivo) {
  return new Promise(function (ok, mal) {
    const url = URL.createObjectURL(archivo);
    const img = new Image();
    img.onload = function () { URL.revokeObjectURL(url); ok(img); };
    img.onerror = function () { URL.revokeObjectURL(url); mal(new Error('imagen')); };
    img.src = url;
  });
}
function aBlob(img, max, calidad) {
  return new Promise(function (ok, mal) {
    const f = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.width * f)); c.height = Math.max(1, Math.round(img.height * f));
    const x = c.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);   // las fotos PNG con fondo transparente quedan en blanco
    x.drawImage(img, 0, 0, c.width, c.height);
    c.toBlob(function (b) { b ? ok(b) : mal(new Error('blob')); }, 'image/jpeg', calidad);
  });
}
// De una foto salen dos: la grande (máximo 1000 px) y una miniatura (360 px) para las tarjetas.
async function procesarFoto(archivo) {
  const img = await cargarImagen(archivo);
  return { full: await aBlob(img, 1000, 0.82), thumb: await aBlob(img, 360, 0.75) };
}
async function subirFoto(ruta, blob) {
  const r = await sb.storage.from(BUCKET).upload(ruta, blob, { contentType: 'image/jpeg', cacheControl: '31536000' });
  if (r.error) throw r.error;
}

function mostrarError(msg, selector) {
  const e = $('#f-error'); if (e) { e.textContent = msg; e.hidden = false; }
  const c = selector && $(selector); if (c) c.focus();
}

/* ---------- Guardar una reseña ---------- */
async function guardarFormulario() {
  const ed = estado.ed; if (!ed || estado.guardando) return;
  if (!estado.sesion || !sb) { mostrarError('Necesitas iniciar sesión para guardar.'); return; }
  const titulo = $('#f-titulo').value.trim();
  if (!titulo) { mostrarError('Escribe el nombre para poder guardar.', '#f-titulo'); return; }
  const btn = $('#f-guardar');
  estado.guardando = true;
  if (btn) { btn.disabled = true; btn.textContent = 'Guardando…'; }
  const b = ed.base, id = ed.id || nuevoId(), uid = estado.sesion.id;
  const viejos = [], subidas = [];
  let fotoPath = b ? b.fotoPath : null, thumbPath = b ? b.thumbPath : null;
  try {
    if (ed.nuevaFoto) {
      const sello = Date.now().toString(36);
      const pf = uid + '/' + id + '/' + sello + '-g.jpg', pt = uid + '/' + id + '/' + sello + '-m.jpg';
      await subirFoto(pf, ed.nuevaFoto.full); subidas.push(pf);
      await subirFoto(pt, ed.nuevaFoto.thumb); subidas.push(pt);
      if (fotoPath) viejos.push(fotoPath);
      if (thumbPath) viejos.push(thumbPath);
      fotoPath = pf; thumbPath = pt;
    } else if (!ed.foto && fotoPath) {
      viejos.push(fotoPath); if (thumbPath) viejos.push(thumbPath);
      fotoPath = null; thumbPath = null;
    }
    const fila = {
      titulo: titulo, categoria: ed.categoria, generos: ed.generos, fecha: $('#f-fecha').value,
      descripcion: $('#f-desc').value.trim().slice(0, 500), nota: ed.nota,
      veredicto: $('#f-veredicto').value.trim().slice(0, 120), resenia: limpiar($('#f-resenia').innerHTML),
      foto_path: fotoPath, thumb_path: thumbPath, publica: ed.publica
    };
    const r = b ? await sb.from('reviews').update(fila).eq('id', id) : await sb.from('reviews').insert(Object.assign({ id: id }, fila));
    if (r.error) throw r.error;
    if (viejos.length) sb.storage.from(BUCKET).remove(viejos);
    estado.ed = null;
    try { await cargarItems(); } catch (e2) { /* se verá al volver a cargar */ }
    toast('Guardado');
    location.hash = '#r-' + id;
  } catch (e) {
    console.error(e);
    if (subidas.length) sb.storage.from(BUCKET).remove(subidas);
    mostrarError('No se pudo guardar. Revisa tu internet e intenta otra vez.');
  } finally {
    estado.guardando = false;
    const bt = $('#f-guardar'); if (bt) { bt.disabled = false; bt.textContent = 'Guardar'; }
  }
}

function formato(cmd) {
  const ed = $('#f-resenia'); if (!ed) return;
  if (document.activeElement !== ed) ed.focus();
  if (cmd === 'bold' || cmd === 'italic') { document.execCommand(cmd); return; }
  if (cmd === 'list') { document.execCommand('insertUnorderedList'); return; }
  const tag = cmd === 'h2' ? 'h2' : 'blockquote';
  const actual = String(document.queryCommandValue('formatBlock') || '').toLowerCase();
  document.execCommand('formatBlock', false, actual === tag ? 'p' : tag);
}

function addGenero() {
  const inp = $('#f-gen-nuevo'); if (!inp) return;
  const g = inp.value.trim().slice(0, 30);
  if (!g) return;
  if (!estado.ed.generos.some(x => norm(x) === norm(g))) estado.ed.generos.push(g);
  inp.value = '';
  $('#chips-gen').innerHTML = chipsGeneros();
}
function cambiarNota(n) {
  estado.ed.nota = redondear(Math.max(1, Math.min(5, n)));
  $('#f-nota').value = estado.ed.nota;
  $('#nota-prev').innerHTML = notaPrevHTML();
}

/* ---------- Respaldo, importar y pasar lo local a la nube ---------- */
function exportar() {
  const datos = JSON.stringify({ app: 'claquetazo', version: 2, items: estado.items });
  const url = URL.createObjectURL(new Blob([datos], { type: 'application/json' }));
  const a = document.createElement('a');
  a.href = url; a.download = 'claquetazo-respaldo-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
  toast('Respaldo pedido. Revisa tus descargas.');
}

// Sube reseñas "crudas" (de la versión anterior o de un respaldo) a la nube, como privadas.
async function subirALaNube(crudos) {
  const uid = estado.sesion.id, hechos = [];
  let fallos = 0;
  for (let i = 0; i < crudos.length; i++) {
    const raw = crudos[i], id = nuevoId(), subidas = [];
    toast('Subiendo ' + (i + 1) + ' de ' + crudos.length + '…');
    try {
      let fp = null, tp = null;
      if (typeof raw.foto === 'string' && raw.foto.indexOf('data:image/') === 0) {
        const fotos = await procesarFoto(await (await fetch(raw.foto)).blob());
        const sello = Date.now().toString(36);
        fp = uid + '/' + id + '/' + sello + '-g.jpg'; tp = uid + '/' + id + '/' + sello + '-m.jpg';
        await subirFoto(fp, fotos.full); subidas.push(fp);
        await subirFoto(tp, fotos.thumb); subidas.push(tp);
      }
      const d = normalizar(Object.assign({}, raw, { id: id, foto: null, thumb: null }));
      const r = await sb.from('reviews').insert({
        id: id, titulo: d.titulo, categoria: d.categoria, generos: d.generos, fecha: d.fecha, descripcion: d.descripcion,
        nota: d.nota, veredicto: d.veredicto, resenia: limpiar(d.resenia), foto_path: fp, thumb_path: tp, publica: false
      });
      if (r.error) throw r.error;
      const coms = (raw.comentarios || []).filter(c => c && typeof c.texto === 'string' && c.texto.trim().length >= MIN_COMENTARIO)
        .map(c => ({ review_id: id, texto: c.texto.trim().slice(0, 5000) }));
      if (coms.length) await sb.from('comments').insert(coms);
      hechos.push(raw);
    } catch (e) {
      console.error(e); fallos++;
      if (subidas.length) sb.storage.from(BUCKET).remove(subidas);
    }
  }
  return { hechos: hechos, fallos: fallos };
}
async function contarLocales() {
  try { estado.locales = (await Local.todos()).filter(x => x && !x.ejemplo && typeof x.titulo === 'string').length; }
  catch (e) { estado.locales = 0; }
}
async function migrarLocales() {
  const lista = (await Local.todos()).filter(x => x && !x.ejemplo && typeof x.titulo === 'string');
  const r = await subirALaNube(lista);
  for (const raw of r.hechos) await Local.borrar(raw.id);
  await contarLocales();
  await cargarItems();
  toast(r.fallos ? r.hechos.length + ' subidas, ' + r.fallos + ' con error. Toca de nuevo para reintentar.' : r.hechos.length + ' reseña' + (r.hechos.length === 1 ? '' : 's') + ' en la nube, como privadas.');
}
function importar(archivo) {
  const lector = new FileReader();
  lector.onload = function () {
    seguro(async function () {
      let d;
      try { d = JSON.parse(lector.result); } catch (e) { toast('Ese archivo no es un respaldo de Claquetazo.'); return; }
      const lista = (Array.isArray(d) ? d : (d && d.items)) || [];
      const validas = lista.filter(r => r && typeof r.titulo === 'string');
      if (!validas.length) { toast('Ese archivo no es un respaldo de Claquetazo.'); return; }
      const r = await subirALaNube(validas);
      await cargarItems();
      toast(r.hechos.length + ' reseña' + (r.hechos.length === 1 ? '' : 's') + ' importada' + (r.hechos.length === 1 ? '' : 's') + (r.fallos ? ', ' + r.fallos + ' con error' : ''));
    });
  };
  lector.readAsText(archivo);
}

/* ---------- Sesión ---------- */
async function iniciarSesion(email, clave) {
  const r = await sb.auth.signInWithPassword({ email: email, password: clave });
  if (r.error) throw r.error;
}

// Se llama al abrir la app y cada vez que alguien entra o sale.
async function alCambiarSesion(user, primera) {
  const antes = estado.sesion ? estado.sesion.id : null;
  const ahora = user ? user.id : null;
  estado.sesion = user || null;
  estado.iniciado = true;
  document.body.classList.toggle('con-sesion', !!user);
  if (!primera && antes === ahora) return;   // solo se renovó la sesión
  estado.items = []; estado.cargando = true; estado.locales = 0;
  const c = await Copia.leer(claveCopia());
  if (c) estado.items = c.map(normalizar);
  renderSuave();   // muestra la copia guardada mientras llega lo nuevo
  if (sb) await refrescar(); else { estado.sinConexion = true; estado.cargando = false; }
  if (user) await contarLocales();
  if (primera) { if (location.hash.slice(1)) render(true); } else renderSuave();
}

/* ---------- Eventos ---------- */
document.addEventListener('click', function (e) {
  const b = e.target.closest('[data-action]'); if (!b) return;
  const a = b.dataset.action, id = b.dataset.id;
  switch (a) {
    case 'empezar': entrarApp(); break;
    case 'filtro': estado.cat = b.dataset.cat; render(false); break;
    case 'top-tab': estado.topTab = b.dataset.tab; render(false); break;
    case 'reintentar': estado.cargando = true; refrescar().then(function () { renderSuave(); }); break;
    case 'salir':
      sb.auth.signOut().then(function () { toast('Sesión cerrada'); location.hash = '#inicio'; });
      break;
    case 'fav-toggle':
      seguro(async function () {
        const it = porId(id);
        if (it && it.fav != null) { await quitarFav(id); toast('Quitada de favoritas'); }
        else if (await agregarFav(id)) toast('Agregada a favoritas');
      });
      break;
    case 'fav-add': seguro(function () { return agregarFav(id); }); break;
    case 'fav-quitar': seguro(function () { return quitarFav(id); }); break;
    case 'fav-up': seguro(function () { return moverFav(id, -1); }); break;
    case 'fav-down': seguro(function () { return moverFav(id, 1); }); break;
    case 'borrar':
      if (b.classList.contains('sure')) { seguro(async function () { await borrarItem(id); toast('Reseña borrada'); location.hash = '#inicio'; }); }
      else { b.classList.add('sure'); b.textContent = 'Toca otra vez para borrar'; setTimeout(function () { b.classList.remove('sure'); b.textContent = 'Borrar'; }, 4000); }
      break;
    case 'borrar-com':
      seguro(async function () {
        const r = await sb.from('comments').delete().eq('id', b.dataset.cid);
        if (r.error) throw r.error;
        await cargarComentarios(id);
        pintarComentarios(porId(id));
      }, 'No se pudo borrar el comentario.');
      break;
    case 'migrar':
      b.disabled = true;
      seguro(migrarLocales, 'No se pudieron subir las reseñas.').then(function () { b.disabled = false; });
      break;
    case 'ed-cat': if (estado.ed.categoria !== b.dataset.cat) { estado.ed.categoria = b.dataset.cat; estado.ed.generos = []; $('#chips-cat').innerHTML = chipsCategoria(); $('#chips-gen').innerHTML = chipsGeneros(); } break;
    case 'ed-gen': { const g = b.dataset.g, i = estado.ed.generos.indexOf(g); if (i >= 0) estado.ed.generos.splice(i, 1); else estado.ed.generos.push(g); $('#chips-gen').innerHTML = chipsGeneros(); break; }
    case 'ed-gen-add': addGenero(); break;
    case 'ed-vis': estado.ed.publica = b.dataset.v === '1'; $('#vis').innerHTML = visHTML(); break;
    case 'ed-quitar-foto': estado.ed.foto = null; estado.ed.nuevaFoto = null; $('#foto-ed').innerHTML = fotoEdHTML(); break;
    case 'ed-nota-mas': cambiarNota(estado.ed.nota + 0.1); break;
    case 'ed-nota-menos': cambiarNota(estado.ed.nota - 0.1); break;
    case 'ed-fmt': formato(b.dataset.cmd); break;
    case 'exportar': exportar(); break;
  }
});

// Los botones de formato no deben quitarle el cursor a la reseña.
document.addEventListener('mousedown', function (e) { if (e.target.closest('.tb')) e.preventDefault(); });

document.addEventListener('input', function (e) {
  const t = e.target;
  if (t.id === 'q') { estado.q = t.value; pintarGrid(); }
  else if (t.id === 'f-nota') { estado.ed.nota = redondear(parseFloat(t.value)); $('#nota-prev').innerHTML = notaPrevHTML(); }
  else if (t.id === 'com-texto') {
    const n = t.value.trim().length;
    $('#com-cont').textContent = n + ' / ' + MIN_COMENTARIO;
    $('#com-cont').classList.toggle('ok', n >= MIN_COMENTARIO);
    $('#com-btn').disabled = n < MIN_COMENTARIO;
  }
  else if (t.id === 'f-titulo') { const er = $('#f-error'); if (er) er.hidden = true; }
});

document.addEventListener('change', function (e) {
  const t = e.target;
  if (t.id === 'orden') { estado.orden = t.value; pintarGrid(); }
  else if (t.id === 'top-cat') { estado.topCat = t.value; estado.topGen = 'todos'; render(false); }
  else if (t.id === 'top-gen') { estado.topGen = t.value; render(false); }
  else if (t.id === 'foto' && t.files && t.files[0]) {
    procesarFoto(t.files[0]).then(function (fotos) {
      estado.ed.nuevaFoto = fotos; estado.ed.foto = URL.createObjectURL(fotos.full);
      $('#foto-ed').innerHTML = fotoEdHTML();
    }).catch(function () { mostrarError('No pude leer esa foto. Prueba con otra.'); });
  }
  else if (t.id === 'f-importar' && t.files && t.files[0]) { importar(t.files[0]); t.value = ''; }
});

document.addEventListener('keydown', function (e) {
  if ((e.key === 'Enter' || e.key === ' ') && document.querySelector('.bienvenida')) { e.preventDefault(); entrarApp(); return; }
  if (e.key === 'Enter' && e.target.matches && e.target.matches('#f input')) {
    e.preventDefault();
    if (e.target.id === 'f-gen-nuevo') addGenero();
  }
});

document.addEventListener('submit', function (e) {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'f') { guardarFormulario(); }
  else if (f.id === 'flogin') {
    const err = $('#login-error'), btn = $('#login-btn');
    const email = $('#login-email').value.trim(), clave = $('#login-clave').value;
    err.hidden = true;
    if (!email || !clave) { err.textContent = 'Escribe tu correo y tu contraseña.'; err.hidden = false; return; }
    if (!sb) { err.textContent = 'No pude conectar con la nube. Revisa tu internet y recarga la página.'; err.hidden = false; return; }
    btn.disabled = true; btn.textContent = 'Entrando…';
    iniciarSesion(email, clave).then(function () { location.hash = '#inicio'; }).catch(function (er) {
      err.textContent = (er && /invalid|credentials/i.test(er.message || '')) ? 'Correo o contraseña incorrectos.' : 'No pude conectar. Revisa tu internet e intenta otra vez.';
      err.hidden = false; btn.disabled = false; btn.textContent = 'Entrar';
    });
  }
  else if (f.id === 'fcom') {
    const id = f.dataset.id, txt = $('#com-texto').value.trim();
    if (txt.length < MIN_COMENTARIO || !estado.sesion || !sb) return;
    $('#com-btn').disabled = true;
    (async function () {
      try {
        const r = await sb.from('comments').insert({ review_id: id, texto: txt });
        if (r.error) throw r.error;
        await cargarComentarios(id);
        const ta = $('#com-texto'); if (ta) { ta.value = ''; $('#com-cont').textContent = '0 / ' + MIN_COMENTARIO; $('#com-cont').classList.remove('ok'); }
        pintarComentarios(porId(id));
        toast('Comentario publicado');
      } catch (er) { console.error(er); toast('No se pudo publicar el comentario.'); const bt = $('#com-btn'); if (bt) bt.disabled = false; }
    })();
  }
});

window.addEventListener('hashchange', function () { render(true); });

/* =====================================================================
   8. ARRANQUE
   ===================================================================== */
(async function iniciar() {
  await Copia.abrir();
  const hay = iniciarCliente();
  render(false);
  if (!hay) { await alCambiarSesion(null, true); return; }
  sb.auth.onAuthStateChange(function (evento, ses) {
    // Se pospone un instante para no pedir cosas a Supabase dentro de su propio aviso.
    setTimeout(function () { alCambiarSesion(ses ? ses.user : null, evento === 'INITIAL_SESSION'); }, 0);
  });
  setTimeout(function () { if (!estado.iniciado) alCambiarSesion(null, true); }, 3000);
})();

})();
</script>
