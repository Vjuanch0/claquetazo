<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05181c">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest?v=18">
<link rel="icon" href="favicon.svg?v=18" type="image/svg+xml">
<link rel="icon" href="favicon.ico?v=18" sizes="48x48">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=18">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Aluna</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/inter-latin-wght-normal.woff2) format('woff2')}
@font-face{font-family:'Newsreader';font-style:normal;font-weight:200 800;font-display:swap;src:url(fonts/newsreader-latin-wght-normal.woff2) format('woff2')}
@font-face{font-family:'Newsreader';font-style:italic;font-weight:200 800;font-display:swap;src:url(fonts/newsreader-latin-wght-italic.woff2) format('woff2')}
@font-face{font-family:'Outfit';font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/outfit-latin-wght-normal.woff2) format('woff2')}
/* Aluna: verde azulado oscuro y naranja. Una semilla que crece hasta florecer (la orquídea) como sistema de nota.
   Títulos en Outfit, interfaz en Inter, lectura larga en serif. */
:root{
  color-scheme:dark;
  --bg:#05181c;
  --surface:#0b2327;
  --surface-2:#11313a;
  --line:#1f4a4d;
  --nav-bg:#061b1f;
  --ink:#eaf5f2;
  --ink-dim:#8fb3ae;
  --ink-faint:#6f918c;
  --accent:#e8590c;
  --accent-hi:#ff6a13;
  --lilac:#ff9a3c;
  --orchid:#ff8a2a;
  --plon-on:#ff9a3c;
  --plon-off:#1a3b3e;
  --v1:#ff5a4d;
  --v2:#ff7a2a;
  --v3:#ffa03c;
  --v4:#ffc83d;
  --v5:#ffe066;
  --display:'Outfit','Inter',system-ui,sans-serif;
  --ui:'Inter',Arial,'Helvetica Neue',system-ui,sans-serif;
  --lectura:'Newsreader',Georgia,'Times New Roman',serif;
}
*,*::before,*::after{box-sizing:border-box}
/* Tamaño base que se adapta al ancho: ~14 px en celular, 16 px en PC. Todo lo demás está en rem y se escala solo. */
html{font-size:clamp(13.5px,.9vw + 10.4px,16px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0}
body{
  background:var(--bg);color:var(--ink);
  font:400 1rem/1.5 var(--ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;
  -webkit-text-size-adjust:100%;
}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lilac);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#shell{max-width:1120px;margin:0 auto;padding-block:18px 120px}
#vista{min-width:0}

/* ---------- Navegación ---------- */
#nav{
  position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;
  background:var(--nav-bg);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));
}
.nav-i{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;font-size:0.75rem;font-weight:500;color:var(--ink-dim);border-radius:8px}
.nav-i .ic{width:24px;height:24px}
.nav-i[aria-current="page"]{color:var(--lilac)}
.nav-i.mas .ic{width:36px;height:36px;padding:7px;border-radius:50%;background:var(--accent);color:#fff}
body.en-bienvenida #nav{display:none}
@media(min-width:860px){
  #nav{left:0;right:auto;top:0;bottom:0;width:92px;flex-direction:column;justify-content:flex-start;gap:8px;
    border-top:0;border-right:1px solid var(--line);
    padding:calc(24px + env(safe-area-inset-top,0px)) 8px 16px calc(8px + env(safe-area-inset-left,0px))}
  .nav-i{flex:none}
  #shell{padding-left:100px;padding-block:28px 60px}
  body.en-bienvenida #shell{padding-left:0}
}

/* ---------- Piezas comunes ---------- */
.logo{display:inline-flex;align-items:center;gap:10px;font-family:var(--display);font-size:clamp(1.4rem,5vw,1.7rem);letter-spacing:.05em;text-transform:uppercase;line-height:1}
.rayitas{display:inline-block;width:30px;height:16px;border-radius:2px;background:repeating-linear-gradient(115deg,var(--ink) 0 5px,var(--accent) 5px 10px)}
.cab{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.cuenta{color:var(--ink-dim);font-size:0.875rem}
h1.pag{font-family:var(--display);font-weight:400;font-size:clamp(1.9rem,6.5vw,2.4rem);line-height:1;letter-spacing:.03em;margin:4px 0 18px;text-transform:uppercase}
h2.sec{font-family:var(--display);font-weight:400;font-size:1.5rem;letter-spacing:.04em;margin:28px 0 12px;text-transform:uppercase}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:6px;
  border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-weight:600}
.btn:hover{border-color:var(--lilac)}
.btn.prim{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.prim:hover{background:var(--accent-hi);border-color:var(--accent-hi)}
.btn.peligro{color:var(--v1)}
.btn.peligro.sure{background:var(--v1);color:#1a0610;border-color:var(--v1)}
.btn.grande{min-height:52px;padding:0 32px;font-size:1.05rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn .ic{width:20px;height:20px}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.in{width:100%;min-height:46px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.in:focus{border-color:var(--lilac);outline:none}
.in::placeholder{color:var(--ink-faint)}
textarea.in{resize:vertical;min-height:84px;line-height:1.5}
.aviso{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;padding:12px 14px;border:1px dashed var(--line);border-radius:6px;color:var(--ink-dim);font-size:0.875rem}
.aviso .btn{min-height:36px;padding:0 12px;font-size:0.875rem}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);z-index:40;
  max-width:min(92vw,420px);padding:10px 16px;border-radius:6px;background:var(--ink);color:var(--bg);font-weight:600;font-size:0.875rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(min-width:860px){#toast{bottom:28px}}

/* ---------- Ploncitos ---------- */
.plones{--pl:1.3em;display:inline-flex;gap:1px;vertical-align:middle}
.pl{position:relative;display:block;width:var(--pl);height:var(--pl)}
.pl svg{display:block;width:var(--pl);height:var(--pl)}
.pl-off{color:var(--plon-off)}
.pl-on{position:absolute;left:0;top:0;height:100%;overflow:hidden;color:var(--vc,var(--plon-on))}
.plones.chico{--pl:1.05em}
.plones.grande{--pl:clamp(1.5rem,6vw,2rem)}

/* ---------- Bienvenida ---------- */
.bienvenida{position:fixed;inset:0;z-index:30;isolation:isolate;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#04141a;-webkit-tap-highlight-color:transparent;outline:none;user-select:none;-webkit-user-select:none;
  padding:max(12px,env(safe-area-inset-top,0px)) max(8px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.bv-fondo{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bv-g{position:absolute;border-radius:50%;filter:blur(70px);animation:respira 18s ease-in-out infinite alternate}
.bv-g1{width:90vmax;height:90vmax;right:-45vmax;top:-48vmax;background:rgba(18,110,112,.55)}
.bv-g2{width:80vmax;height:60vmax;left:-30vmax;bottom:-38vmax;background:rgba(255,106,19,.30);animation-delay:-6s}
.bv-g3{width:50vmax;height:50vmax;left:-20vmax;top:10vmax;background:rgba(14,80,84,.4);animation-delay:-11s}
@keyframes respira{from{transform:translate(0,0) scale(1)}to{transform:translate(3vmax,2vmax) scale(1.1)}}
.bv-polvo{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.bv-centro{display:flex;flex-direction:column;align-items:center;gap:4px}
.bv-orq{display:block;width:min(84vw,390px);height:auto;max-height:56dvh;overflow:visible;pointer-events:none}
.bv-marca{display:grid;justify-items:center;gap:4px;opacity:0;transform:translateY(10px);transition:opacity 1.1s ease,transform 1.1s ease}
.bienvenida.marca .bv-marca{opacity:1;transform:none}
.bv-nombre{font:600 clamp(2.8rem,12vw,3.8rem)/1 var(--display);letter-spacing:.01em;color:var(--ink);text-shadow:0 0 34px rgba(255,138,42,.35)}
.bv-lema{font-size:.95rem;color:var(--ink-dim)}
.bv-toca{position:absolute;left:0;right:0;bottom:max(46px,calc(env(safe-area-inset-bottom,0px) + 40px));margin:0;text-align:center;font-size:.8125rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);opacity:0;animation:subefade .8s ease-out 3s forwards}
.bv-carga{position:absolute;left:50%;bottom:max(22px,calc(env(safe-area-inset-bottom,0px) + 14px));width:min(150px,38vw);height:2px;margin-left:calc(min(150px,38vw) / -2);
  border-radius:2px;overflow:hidden;background:rgba(255,154,60,.14);opacity:0;animation:subefade .8s ease-out .9s forwards}
.bv-carga::after{content:"";display:block;height:100%;background:linear-gradient(90deg,#e8590c,#ffb066);transform-origin:left center;transform:scaleX(0);animation:carga var(--dur,4s) linear forwards}
@keyframes carga{to{transform:scaleX(1)}}
@keyframes subefade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.bv-g{animation:none!important}.bv-marca{opacity:1;transform:none;transition:none}.bv-toca,.bv-carga{animation:none;opacity:1}.bv-carga::after{animation:none;transform:none;opacity:.5}}

/* ---------- Home ---------- */
.buscar{display:grid;grid-template-columns:minmax(0,1fr) minmax(112px,150px);gap:10px;margin-bottom:14px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:20px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px 9px;color:var(--ink-dim);font-weight:600;font-size:0.9375rem;white-space:nowrap}
.tab small{color:var(--ink-faint);margin-left:4px;font-weight:500}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--lilac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:22px 14px}
@media(min-width:860px){.grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:32px 22px}}
.card .poster{transition:transform .25s ease,box-shadow .25s ease}
.card:hover .poster,.card:focus-visible .poster{transform:translateY(-5px);box-shadow:0 14px 32px rgba(255,106,19,.35)}
/* Cartelera: letrero de marquesina y función destacada */
.marquesina{display:flex;align-items:center;gap:12px;margin:4px 0 16px}
.marq-t{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(1.7rem,6vw,2.4rem);letter-spacing:.09em;line-height:1;text-transform:uppercase;white-space:nowrap}
.bombillas{flex:1;height:10px;background:radial-gradient(circle at 50% 50%,var(--orchid) 0 2px,transparent 2.8px) 0 0/16px 10px repeat-x;animation:bombillas 2.6s ease-in-out infinite alternate}
@keyframes bombillas{from{opacity:.3}to{opacity:.95}}
.fondo-bl{position:absolute;inset:-30px;z-index:-1;background-size:cover;background-position:center;filter:blur(26px) saturate(1.35);opacity:.4;transform:scale(1.1)}
.dest,.d-hero{position:relative;isolation:isolate;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.dest::after,.d-hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(5,24,28,.2),rgba(5,24,28,.8))}
.dest{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr);gap:clamp(12px,3vw,28px);align-items:center;padding:clamp(12px,3vw,24px);margin-bottom:24px}
.dest .poster{max-width:250px;box-shadow:0 16px 40px rgba(0,0,0,.55);transition:transform .25s}
.dest:hover .poster{transform:translateY(-3px)}
.dest-info{display:grid;gap:8px;min-width:0;justify-items:start}
.dest-ey{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--orchid);font-weight:700}
.dest-t{font-family:var(--display);font-size:clamp(1.8rem,6.4vw,3.2rem);line-height:1;letter-spacing:.03em;text-transform:uppercase;overflow-wrap:anywhere}
.dest-v{font-family:var(--lectura);font-style:italic;font-size:1.08rem;line-height:1.4;color:var(--ink-dim);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.dest-ir{margin-top:4px;font-weight:700;color:var(--lilac)}
.bors{margin:0 0 24px}
.bor-l{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.bor-l li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;background:var(--surface);border:1px dashed var(--line);border-radius:6px}
.bor-a{display:grid;gap:1px;min-width:0}
.bor-a b{font-weight:600;overflow-wrap:anywhere}
.bor-a small{color:var(--ink-faint);font-size:.8125rem}
.card{display:block;min-width:0}
.poster{position:relative;aspect-ratio:2/3;max-width:100%;background:var(--surface-2);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.poster img{display:block;width:100%;height:100%;object-fit:cover}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;gap:8px;padding:12px 12px 46px;
  background:linear-gradient(165deg,hsl(var(--h) 55% 24%),hsl(calc(var(--h) + 24) 60% 9%))}
.ph-cat{font-size:0.6875rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);font-weight:600}
.ph-t{font-family:var(--display);font-size:1.6rem;line-height:1;text-transform:uppercase;overflow:hidden;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.nota-b{position:absolute;left:8px;bottom:8px;padding:1px 8px;border-radius:3px;background:var(--bg);border:1px solid var(--line);color:var(--vc);font-family:var(--display);font-size:1.3rem;line-height:1.3;letter-spacing:.04em}
.tag-ej,.tag-priv{position:absolute;top:8px;right:8px;padding:2px 6px;border-radius:3px;background:var(--bg);color:var(--ink-dim);font-size:0.625rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.tag-priv{right:auto;left:8px;color:var(--lilac)}
.card-b{padding-top:10px;display:grid;gap:3px}
.card-cat{font-size:0.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim)}
.card h3{margin:0;font-size:1rem;font-weight:600;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.card-s{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;margin-top:2px}
.palabra{font-family:var(--display);letter-spacing:.05em;text-transform:uppercase;color:var(--vc);font-size:1.05rem}
.card:hover h3{color:var(--lilac)}
.vacio-box{grid-column:1/-1;padding:36px 20px;border:1px dashed var(--line);border-radius:6px;text-align:left;color:var(--ink-dim);display:grid;gap:12px;justify-items:start}
.vacio-box strong{color:var(--ink);font-size:1.1rem}

/* ---------- Detalle ---------- */
.volver{display:inline-flex;align-items:center;gap:6px;margin-bottom:16px;color:var(--ink-dim);font-weight:500}
.volver .ic{width:20px;height:20px}
.d-hero{padding:clamp(14px,3vw,28px);margin-bottom:4px}
.d-cab{display:grid;grid-template-columns:minmax(0,36%) minmax(0,1fr);gap:clamp(14px,3.5vw,30px);align-items:start}
.d-poster{position:relative;aspect-ratio:2/3;max-width:300px;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2);box-shadow:0 16px 44px rgba(0,0,0,.55)}
.d-poster.ya{aspect-ratio:auto}
.d-poster img{display:block;width:100%;height:100%;object-fit:cover}
.d-poster.ya img{height:auto}
.d-hero.ancha .d-cab{grid-template-columns:minmax(0,1fr)}
.d-hero.ancha .d-poster{max-width:820px;width:100%;margin:0 auto}
.libro{max-width:42rem;margin:26px auto 0}
.prosa>p:first-child::first-letter{font-family:var(--display);float:left;font-size:3.1em;line-height:.8;padding:.07em .1em 0 0;color:var(--lilac)}
.d-info{min-width:0;display:grid;gap:8px}
.d-info h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(1.9rem,7vw,3rem);line-height:1;letter-spacing:.03em;text-transform:uppercase;overflow-wrap:anywhere}
.meta{margin:0;font-size:0.8125rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim)}
.chips-ro{display:flex;flex-wrap:wrap;gap:6px}
.chips-ro span{padding:3px 10px;border:1px solid var(--line);border-radius:999px;font-size:0.8125rem;color:var(--ink-dim)}
.desc{margin:0;color:var(--ink-dim);font-size:0.9375rem}
.vb{display:flex;flex-wrap:wrap;align-items:center;gap:8px 22px;margin:22px 0 6px;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.vb-num{font-family:var(--display);font-size:clamp(2.6rem,9vw,3.6rem);line-height:.9;color:var(--vc);letter-spacing:.02em}
.vb-de{color:var(--ink-faint);margin-left:4px;font-size:1rem}
.vb-med{display:grid;gap:2px}
.vb-pal{font-family:var(--display);font-size:clamp(1.3rem,4.6vw,1.8rem);letter-spacing:.06em;text-transform:uppercase;color:var(--vc);line-height:1.1}
.titular{margin:22px 0 4px;font-family:var(--lectura);font-style:italic;font-size:clamp(1.4rem,5vw,1.9rem);line-height:1.25;max-width:34ch;text-wrap:balance}
.prosa,.rte{font-family:var(--lectura);font-size:calc(1.15rem * var(--esc,1));line-height:1.7}
.prosa{margin-top:18px}
.prosa p,.rte p,.rte div{margin:0 0 1em}
.prosa h2,.rte h2{font-family:var(--ui);font-size:1.5rem;line-height:1.2;margin:1.4em 0 .5em;font-weight:700;text-wrap:balance}
.prosa h3,.rte h3{font-family:var(--ui);font-size:1.2rem;margin:1.2em 0 .4em;font-weight:700}
.prosa blockquote,.rte blockquote{margin:1.2em 0;padding:2px 0 2px 18px;border-left:3px solid var(--accent-hi);color:var(--ink-dim);font-style:italic}
.prosa ul,.prosa ol,.rte ul,.rte ol{padding-left:1.4em;margin:0 0 1em}
.vacio{color:var(--ink-faint);font-style:italic}
.lectura-t{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;margin:6px 0 0;font-size:0.8125rem;color:var(--ink-faint)}
.acciones{display:flex;flex-wrap:wrap;gap:10px;margin:26px 0 8px}
.coms{margin-top:34px}
.coms ul{list-style:none;padding:0;margin:0 0 20px;display:grid;gap:12px}
.coms li{padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.coms li p{margin:0 0 8px;font-family:var(--lectura);font-size:1.1rem;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.coms footer{display:flex;align-items:center;justify-content:space-between;color:var(--ink-faint);font-size:0.8125rem}
.barra-g{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.olvide-l{margin:0;font-size:.9375rem}
.olvide-l a{color:var(--lilac);text-decoration:underline;text-underline-offset:3px}
.ver-clave{display:flex;align-items:center;gap:8px;font-size:.875rem;color:var(--ink-dim)}
.ver-clave input{width:18px;height:18px;accent-color:var(--accent)}
.link-b{background:none;border:0;padding:6px 0;color:var(--ink-faint);text-decoration:underline;font-size:0.8125rem}
.contador{font-size:0.8125rem;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.contador.ok{color:var(--v4)}

/* ---------- Editor ---------- */
.form{max-width:680px;display:grid;gap:22px}

.ayuda{margin:0;font-size:0.8125rem;color:var(--ink-faint)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:38px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--ink-dim);font-size:0.875rem}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.gen-nuevo{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:32px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--v1),var(--v3) 50%,var(--v5))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-10px;border-radius:50%;background:var(--ink);border:4px solid var(--accent)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--v1),var(--v3) 50%,var(--v5))}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--ink);border:4px solid var(--accent)}

/* ---------- Rankings ---------- */
.sub{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}

.rk-t small{color:var(--ink-dim);font-size:0.8125rem;overflow-wrap:anywhere}

/* ---------- Ajustes ---------- */
.ajuste{max-width:620px;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:6px;display:grid;gap:10px;margin-bottom:14px;justify-items:start}

/* ---------- Hojas (ventanas que suben desde abajo) ---------- */

.gen-lista{flex:1;min-height:0;overflow-y:auto;display:grid;grid-auto-rows:max-content;gap:8px;align-content:start;padding-bottom:6px;overscroll-behavior:contain}
.gen-grupo{border:1px solid var(--line);border-radius:8px;overflow:hidden}

.gen-op{position:relative;display:grid;gap:2px;width:100%;text-align:left;padding:10px 46px 10px 14px;background:transparent;border:0;border-top:1px solid var(--line);color:var(--ink)}

.gen-n{font-weight:700}
.gen-op.macro .gen-n{font-family:var(--display);font-weight:400;font-size:1.25rem;letter-spacing:.06em;text-transform:uppercase}
.gen-d{font-size:.8125rem;line-height:1.35;color:var(--ink-dim)}
.gen-ok{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:22px;height:22px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);color:transparent;font-size:.8rem;font-weight:700}
.gen-op[aria-pressed="true"]{background:rgba(255,106,19,.16)}
.gen-op[aria-pressed="true"] .gen-ok{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.ghost{border-style:dashed;color:var(--lilac)}
.hoja-c.enc{align-items:center;text-align:center}
.enc-marco{position:relative;overflow:hidden;width:calc(min(54dvh,460px) * 2 / 3);height:min(54dvh,460px);border-radius:6px;border:2px solid var(--lilac);background:#000;touch-action:none;cursor:grab}
.enc-marco img{position:absolute;left:0;top:0;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
.hoja-c.enc input[type=range]{max-width:320px}
.res-resumen{display:grid;gap:10px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:6px;justify-items:start}
.res-ext{margin:0;font-family:var(--lectura);font-size:1.05rem;line-height:1.55;color:var(--ink-dim)}
pre.sql{margin:0;padding:12px;max-width:100%;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:6px;font:.8125rem/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;user-select:all}

/* ---------- Editor en módulos ---------- */
.ed-top{max-width:1180px}
.ed-top h1.pag{font-size:clamp(1.5rem,4.4vw,1.9rem);margin:0 0 12px}

}

.mod-t{margin:0;display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 8px;font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim)}
.mod-t small{font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink-faint);font-size:.78rem}
.lbl-s{font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim)}
.form.ed .in{min-height:40px;padding:8px 12px;border-radius:8px;font-size:.9375rem}
.form.ed textarea.in{min-height:64px}
.form.ed .btn{min-height:38px;padding:0 14px;font-size:.875rem;border-radius:8px}
.form.ed .chip{min-height:32px;padding:0 12px;font-size:.8125rem}
.chips.sm{gap:6px}
.chips.sm .chip{min-height:29px;padding:0 10px;font-size:.78rem}
.mini{display:inline-flex;align-items:center;min-height:30px;padding:0 11px;border:1px solid var(--line);border-radius:999px;background:rgba(5,24,28,.5);color:var(--ink-dim);font-size:.78rem;font-weight:600;cursor:pointer}
.mini:hover{border-color:var(--lilac);color:var(--ink)}
/* Portada: la foto, el nombre, la categoría y la fecha en una sola tarjeta */
.portada{isolation:isolate;overflow:hidden;padding:16px;grid-template-columns:104px minmax(0,1fr);grid-template-areas:"tit tit" "foto cat" "foto fec" "acc acc";gap:12px 14px;background:linear-gradient(160deg,var(--surface-2),var(--surface))}
.por-fondo{position:absolute;inset:-30px;z-index:-2;background-size:cover;background-position:center;filter:blur(28px) saturate(1.3);transform:scale(1.1);opacity:0;transition:opacity .4s}
.portada.con-foto .por-fondo{opacity:.45}
.portada.con-foto::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(5,24,28,.15),rgba(5,24,28,.6))}
.por-tit{grid-area:tit;display:grid;gap:2px;min-width:0}
.por-eti{font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--lilac)}
.por-titulo{width:100%;padding:2px 0 8px;background:transparent;border:0;border-bottom:2px solid var(--line);border-radius:0;color:var(--ink);font-family:var(--display);font-size:clamp(1.5rem,5.2vw,2.2rem);line-height:1.1;letter-spacing:.03em;text-transform:uppercase}
.por-titulo::placeholder{color:var(--ink-faint);font-family:var(--ui);font-size:.95rem;letter-spacing:0;text-transform:none}
.por-titulo:focus{outline:none;border-bottom-color:var(--orchid)}
#foto-ed{display:contents}
.por-foto{grid-area:foto;align-self:start;display:block;width:100%;cursor:pointer;box-shadow:0 10px 26px rgba(0,0,0,.5)}
.por-foto.vacia{display:grid;place-content:center;justify-items:center;gap:6px;padding:8px;text-align:center;border:1.5px dashed var(--lilac);background:rgba(255,106,19,.10);color:var(--lilac);font-size:.75rem;font-weight:600;box-shadow:none}
.por-foto.vacia .ic{width:26px;height:26px}
.por-acc{grid-area:acc;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.por-cat{grid-area:cat;display:grid;gap:6px;align-content:start;min-width:0}
.por-fec{grid-area:fec;display:grid;gap:4px;align-content:start;min-width:0}
@media(min-width:720px){
  .portada{grid-template-columns:150px minmax(0,1fr);grid-template-areas:"foto tit" "foto cat" "foto fec" "foto acc"}
  .por-acc{align-self:end}
}
/* Nota: ploncitos que se tocan */
.nota-mod{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.nota-tap{position:relative;flex:none}
.plones.xl{--pl:clamp(1.75rem,6.4vw,2.15rem)}
.nota-btns{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr)}
.nota-b1{padding:0;border:0;border-radius:6px;background:transparent;cursor:pointer}
.nota-b1:hover{background:rgba(255,154,60,.14)}
.nota-der{display:flex;align-items:center;gap:6px;margin-left:auto}
.nota-v{display:grid;justify-items:center;min-width:4.4rem;line-height:1}
.nota-v b{font-family:var(--display);font-weight:400;font-size:1.9rem;letter-spacing:.02em;color:var(--vc)}
.nota-v span{font-family:var(--display);font-size:.95rem;letter-spacing:.06em;text-transform:uppercase;color:var(--vc)}
.nota-aj{width:30px;height:30px;padding:0;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;background:transparent;color:var(--ink-dim);font-size:1.05rem;font-weight:700}
.nota-aj:hover{border-color:var(--lilac);color:var(--ink)}
.seg{display:inline-grid;grid-template-columns:1fr 1fr;justify-self:start;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--bg)}
.seg button{min-height:30px;padding:0 18px;border:0;border-radius:999px;background:transparent;color:var(--ink-dim);font-size:.8125rem;font-weight:600}

.ed-bar{display:flex;gap:10px;align-items:center}

/* ---------- Tu reseña: módulo en la página; en celular se abre a pantalla completa ---------- */
.escritorio{display:flex;flex-direction:column}
.esc-barra,.esc-fuera{display:none}
.mod-cab{display:flex;align-items:center;justify-content:space-between;gap:10px}
.esc-scroll{min-width:0}
.esc-hoja{display:grid;gap:8px;min-width:0}
.esc-cat{margin:0;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);overflow-wrap:anywhere}
.esc-nombre{width:100%;padding:4px 0 8px;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;color:var(--ink);font-family:var(--lectura);font-style:italic;font-weight:500;font-size:clamp(1.3rem,4.4vw,1.8rem);line-height:1.25;text-overflow:ellipsis}
.esc-nombre::placeholder{color:var(--ink-faint);font-style:italic}

.nombre-pie{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px;font-size:.78rem;color:var(--ink-faint)}

.esc-pie{display:flex;align-items:center;gap:6px;padding:5px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}

.escritorio.abierto.enfoque .esc-fuera:hover,.escritorio.abierto.enfoque .esc-fuera:focus-visible{opacity:1}

@media(max-width:859px){.ed-bar{border-radius:20px;background:rgba(5,24,28,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}}
#nav{background:rgba(6,27,31,.84);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.nav-i{border-radius:14px;transition:background .2s,color .2s}
.nav-i[aria-current="page"]{background:rgba(255,154,60,.13)}
body:not(.con-sesion) .nav-i.solo-sesion{display:none}
.tab[aria-selected="true"]{color:var(--lilac);border-bottom-color:var(--accent-hi)}
.card:hover .poster,.card:focus-visible .poster{box-shadow:0 14px 32px rgba(255,106,19,.22)}

/* ---------- Inicio: ¿qué quieres sembrar hoy? ---------- */
.sem-cab,.sem-lista,.sem-cta{max-width:640px}
.sem-cab{margin:6px 0 20px}
.sem-saludo{margin:0 0 8px;color:var(--ink-dim);font-size:.92rem}
.sem-h{margin:0;font:600 clamp(2.1rem,8.4vw,3rem)/1.04 var(--display);letter-spacing:-.018em;max-width:13ch}
.sem-h span{color:var(--lilac)}
.sem-lista{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.sem-f{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"n c" "d c";gap:1px 12px;align-items:center;padding:13px 4px;min-height:62px;border-bottom:1px solid var(--line);transition:background .2s}
.sem-fn{grid-area:n;font:600 1.15rem/1.2 var(--display)}
.sem-fd{grid-area:d;color:var(--ink-dim);font-size:.9rem}
.sem-f .ic{grid-area:c;width:22px;height:22px;color:var(--ink-faint);transition:transform .2s,color .2s}
.sem-f:hover .ic,.sem-f:focus-visible .ic{color:var(--lilac);transform:translateX(3px)}
.sem-f:active{background:rgba(255,154,60,.07)}
.sem-cta{position:sticky;bottom:calc(var(--navh,66px) - 1px);z-index:5;margin-top:14px;display:grid;justify-items:center;gap:6px;padding:26px 0 10px;background:linear-gradient(0deg,var(--bg) 72%,rgba(5,24,28,0))}
.sem-cta .btn{width:100%;max-width:440px}
.sem-cta small{color:var(--ink-faint);font-size:.8rem}
@media(min-width:860px){.sem-cta{bottom:0;justify-items:start}}

/* ---------- Diario ---------- */
.sem-dia{margin:22px 0 10px}
.sem-grid{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media(min-width:620px){.sem-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:1000px){.sem-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.sem-card{display:grid;gap:6px;align-content:start;min-width:0;padding:14px 16px;border:1px solid var(--line);border-radius:20px;background:var(--surface);transition:border-color .2s,transform .2s}
.sem-card:hover,.sem-card:focus-visible{border-color:var(--lilac);transform:translateY(-2px)}
.sem-ty{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--lilac);font-weight:700}
.sem-card h3{margin:0;font:600 1.1rem/1.25 var(--display);overflow-wrap:anywhere}
.sem-card p{margin:0;color:var(--ink-dim);font-size:.9rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sem-pie{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px}
.sem-pie .tag-priv{position:static;padding:2px 8px}
.sem-pub{font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}

/* ---------- Escribir una semilla ---------- */
.sem-form{display:grid;gap:14px;max-width:720px}
.sem-ey{margin:0;font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);font-weight:600}
.sem-ask{margin:0;font:600 clamp(1.7rem,6.6vw,2.4rem)/1.1 var(--display);letter-spacing:-.012em;max-width:17ch}
.sem-ask b{color:var(--lilac);font-weight:600}
.sem-tit{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:8px 2px;font:500 1.15rem var(--display);color:var(--ink)}
.sem-tit:focus{outline:none;border-bottom-color:var(--lilac)}
.sem-tit::placeholder,.sem-texto::placeholder{color:var(--ink-faint)}
.sem-texto{width:100%;min-height:190px;resize:none;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 18px;font:400 clamp(1.05rem,3.8vw,1.2rem)/1.65 var(--lectura);color:var(--ink)}
.sem-texto:focus{outline:none;border-color:var(--lilac)}
.sem-pie-t{display:flex;justify-content:space-between;gap:10px;margin:-6px 6px 0;color:var(--ink-faint);font-size:.8rem}
.resalta{color:var(--lilac);font-weight:700}
.sem-nota .mod-t{display:block;text-transform:none;letter-spacing:0;font:600 1.05rem/1.3 var(--display);color:var(--ink)}
.sem-nota .mod-t .link-b{font-weight:400}
.sem-tit-l{margin:6px 0 0;font:600 clamp(1.8rem,6.6vw,2.5rem)/1.1 var(--display);letter-spacing:-.012em}
.sem-lectura{max-width:42rem;margin:0 auto}
.sem-nota-l{display:flex;align-items:center;gap:12px;margin-top:20px;color:var(--vc)}

/* ---------- Ploncitos-orquídea ---------- */
.nw{display:grid;gap:10px}
.nw-arriba{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;justify-items:start;gap:4px 16px}
.nw-orq{width:92px;height:auto;max-height:112px;overflow:visible;transition:opacity .25s,filter .25s}
.nw-num{display:grid;justify-items:start;text-align:left;line-height:1}
.nw-num b{font:600 2.3rem/1 var(--display);color:var(--vc);letter-spacing:-.01em}
.nw-num span{margin-top:6px;font:600 1rem var(--display);color:var(--vc)}
.nw-fino{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px}
.nw-rango{-webkit-appearance:none;appearance:none;width:100%;height:30px;margin:0;background:transparent;cursor:pointer}
.nw-rango::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:linear-gradient(90deg,var(--v1),var(--v2),var(--v3),var(--v4),var(--v5))}
.nw-rango::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:24px;height:24px;margin-top:-9px;border-radius:50%;background:#fff;border:3px solid var(--vc);box-shadow:0 2px 8px rgba(0,0,0,.45)}
.nw-rango::-moz-range-track{height:6px;border-radius:6px;background:linear-gradient(90deg,var(--v1),var(--v2),var(--v3),var(--v4),var(--v5))}
.nw-rango::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--vc);box-shadow:0 2px 8px rgba(0,0,0,.45)}
.nw-et{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.nw-e{display:grid;justify-items:center;gap:1px;padding:4px 2px;border:1px solid var(--line);border-radius:14px;background:transparent;color:var(--ink-dim)}
.nw-e svg{width:100%;height:34px;display:block}
.nw-e small{font-size:.62rem;line-height:1.1;text-align:center}
.nw-e:hover{border-color:var(--vc)}
.nw-e[aria-pressed="true"]{border-color:var(--vc);color:var(--vc);background:rgba(255,154,60,.08)}
.nw-vacio .nw-orq{opacity:.45;filter:saturate(.45)}
.nw-vacio .nw-num b,.nw-vacio .nw-num span{color:var(--ink-faint)}

/* ---------- El viento ---------- */
.viento{position:fixed;inset:0;z-index:70;background:var(--bg);opacity:0;transition:opacity .3s}
.viento.on{opacity:1}
.viento-cv{position:absolute;inset:0;width:100%;height:100%}
.viento-msg{position:absolute;left:0;right:0;top:64%;margin:0;text-align:center;font:300 1.05rem var(--display);color:var(--ink-dim);opacity:0;transition:opacity .6s}
.viento-msg.on{opacity:1}
@media(prefers-reduced-motion:reduce){.viento,.viento-msg{transition:none}.sem-card,.sem-f .ic{transition:none}}

/* ---------- Logo: hoja-lápiz ---------- */
.bv-centro{gap:0}
.bv-logo{display:block;width:min(44vw,190px);height:auto;overflow:visible;filter:drop-shadow(6px 8px 0 rgba(0,0,0,.4)) drop-shadow(0 0 38px rgba(255,122,26,.28));animation:lgFlota 5s ease-in-out 2.4s infinite alternate}
.lg-todo{transform-box:fill-box;transform-origin:50% 100%;animation:lgCrece 1.15s cubic-bezier(.2,.9,.3,1.18) .55s both}
.lg-sem{opacity:0;transform-box:fill-box;transform-origin:50% 50%;animation:lgSem 1.05s ease-in-out both}
.lg-vena{stroke-dasharray:1;animation:lgVena .7s ease-out 1.4s both}
.lg-brillo{animation:lgFade .5s ease-out 1.85s both}
.bv-letras{display:block;width:min(64vw,290px);height:auto;margin-top:12px;overflow:visible;filter:drop-shadow(4px 5px 0 rgba(0,0,0,.35))}
.lg-rev{transform-box:fill-box;transform-origin:0 50%;animation:lgRev 1.3s cubic-bezier(.4,0,.2,1) 1.95s both}
.bv-lema{margin:14px 0 0;font-size:.95rem;color:var(--ink-dim);animation:lgFade .9s ease-out 3.3s both}
.bv-toca{animation-delay:3.7s}
@keyframes lgCrece{0%{transform:scale(.04);opacity:0}18%{opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes lgSem{0%{opacity:0;transform:scale(.3)}35%{opacity:1;transform:scale(1)}70%{opacity:1;transform:scale(1.35)}100%{opacity:0;transform:scale(2.2)}}
@keyframes lgVena{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes lgRev{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes lgFade{from{opacity:0}to{opacity:1}}
@keyframes lgFlota{from{transform:translateY(0)}to{transform:translateY(-5px)}}
@media(prefers-reduced-motion:reduce){.bv-logo,.lg-todo,.lg-sem,.lg-vena,.lg-brillo,.lg-rev,.bv-lema{animation:none!important}}
.logo .mk{height:30px;width:auto;flex:none;filter:drop-shadow(2px 3px 0 rgba(0,0,0,.35))}
.marca-c{display:flex;flex-direction:column;align-items:center;gap:8px;margin:2px 0 14px}
.marca-c .mk,.marca-fila .mk{filter:drop-shadow(3px 4px 0 rgba(0,0,0,.35))}
.marca-fila{display:flex;align-items:center;gap:12px}
.mk{width:auto;display:block}.lt{height:auto;display:block}

/* entrada: la hoja-lápiz escribe */
.bv-escena{display:block;width:min(100vw,460px);height:auto;overflow:visible}
.bv-lema{animation:none;opacity:0;margin:4px 0 0}
.bv-toca{animation-delay:3s}
</style>

const $ = (s, el) => (el || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const nuevoId = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
  : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); });
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const catNombre = id => (CATEGORIAS.find(c => c.id === id) || { nombre: 'Otros' }).nombre;
const redondear = n => Math.round(n * 10) / 10;

function fmtFecha(s) {
  if (!s) return '';
  const p = s.split('-');
  if (p.length < 3) return p[0];
  return (+p[2]) + ' ' + (MESES[(+p[1]) - 1] || '') + ' ' + p[0];
}
function fmtFechaMs(ms) {
  const d = new Date(ms);
  return d.getDate() + ' ' + MESES[d.getMonth()] + ' ' + d.getFullYear();
}
function hash(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; }

// Nota (1.0 a 5.0) -> nivel (1 a 5). 4.9 sigue siendo "melo"; solo 5.0 es "re makia".
function nivel(nota) { return NIVELES[Math.max(1, Math.min(5, Math.floor(nota + 1e-9)))]; }

// Dibuja los 5 ploncitos. Cada uno se llena según lo que falte de la nota (ej: 4.7 = 4 llenos + uno al 70%).
function plones(nota, clase) {
  const nv = nivel(nota);
  let h = '<span class="plones ' + (clase || '') + '" style="--vc:' + nv.color + '" role="img" aria-label="' + nota.toFixed(1) + ' de 5 florecitas">';
  for (let i = 0; i < 5; i++) {
    const f = Math.max(0, Math.min(1, nota - i));
    h += '<span class="pl"><svg class="pl-off" viewBox="0 0 24 24"><use href="#plon"/></svg>' +
         '<span class="pl-on" style="width:' + (f * 100).toFixed(0) + '%"><svg viewBox="0 0 24 24"><use href="#plon"/></svg></span></span>';
  }
  return h + '</span>';
}

// Limpia el HTML de las reseñas: solo deja formato básico y quita todo lo demás.
const PERMITIDAS = new Set(['P', 'BR', 'B', 'STRONG', 'I', 'EM', 'U', 'H2', 'H3', 'BLOCKQUOTE', 'UL', 'OL', 'LI']);
function limpiar(html) {
  const doc = new DOMParser().parseFromString('<body>' + (html || '') + '</body>', 'text/html');
  (function recorrer(nodo) {
    Array.from(nodo.childNodes).forEach(function (h) {
      if (h.nodeType === 3) return;
      if (h.nodeType !== 1) { h.remove(); return; }
      recorrer(h);
      if (PERMITIDAS.has(h.tagName)) {
        Array.from(h.attributes).forEach(a => h.removeAttribute(a.name));
      } else if (['SCRIPT', 'STYLE', 'IFRAME', 'OBJECT', 'EMBED', 'LINK', 'META'].indexOf(h.tagName) >= 0) {
        h.remove();
      } else if (h.tagName === 'DIV') {
        const p = doc.createElement('p');
        while (h.firstChild) p.appendChild(h.firstChild);
        h.replaceWith(p);
      } else {
        while (h.firstChild) h.parentNode.insertBefore(h.firstChild, h);
        h.remove();
      }
    });
  })(doc.body);
  return doc.body.innerHTML.trim();
}
function textoPlano(html) { const d = document.createElement('div'); d.innerHTML = limpiar(html); return d.textContent || ''; }

/* =====================================================================
   3. DATOS: la nube (Supabase) y una copia en este aparato
      Todo vive en Supabase. La copia local sirve para abrir rápido y sin internet.
   ===================================================================== */
function abrirIDB(nombre, almacen, clave) {
  return new Promise(function (ok) {
    try {
      const rq = indexedDB.open(nombre, 1);
      rq.onupgradeneeded = function () { rq.result.createObjectStore(almacen, { keyPath: clave }); };
      rq.onerror = rq.onblocked = function () { ok(null); };
      rq.onsuccess = function () {
        const db = rq.result;
        const tx = function (modo) { return db.transaction(almacen, modo).objectStore(almacen); };
        const pedir = function (f) {
          return new Promise(function (r) {
            try { const q = f(); q.onsuccess = function () { r(q.result); }; q.onerror = function () { r(null); }; } catch (e) { r(null); }
          });
        };
        ok({
          todos: function () { return pedir(function () { return tx('readonly').getAll(); }).then(function (x) { return x || []; }); },
          leer: function (k) { return pedir(function () { return tx('readonly').get(k); }); },
          poner: function (v) { try { tx('readwrite').put(v); return true; } catch (e) { return false; } },
          borrar: function (k) { try { tx('readwrite').delete(k); } catch (e) { /* nada */ } }
        });
      };
    } catch (e) { ok(null); }
  });
}

  escribir(k, v) { return this.db ? this.db.poner({ k: k, v: v }) : false; },

};

// Asegura que cada reseña tenga todos sus campos bien.
function normalizar(r) {
  r = r || {};
  const cat = CATEGORIAS.some(c => c.id === r.categoria) ? r.categoria : 'otros';
  let nota = Number(r.nota); if (!isFinite(nota)) nota = 3;
  nota = redondear(Math.max(1, Math.min(5, nota)));
  const https = s => (typeof s === 'string' && /^https:\/\//.test(s)) ? s : null;
  const ruta = s => (typeof s === 'string' && s) ? s : null;
  return {
    id: (typeof r.id === 'string' && /^[a-z0-9-]+$/i.test(r.id)) ? r.id : nuevoId(),
    titulo: String(r.titulo || 'Sin título').slice(0, 200),
    categoria: cat,
    generos: Array.isArray(r.generos) ? r.generos.map(g => String(g).slice(0, 30)).slice(0, 12) : [],
    fecha: /^\d{4}(-\d{2}-\d{2})?$/.test(r.fecha || '') ? r.fecha : '',
    descripcion: String(r.descripcion || '').slice(0, 500),
    nota: nota,
    veredicto: String(r.veredicto || '').slice(0, 120),
    resenia: typeof r.resenia === 'string' ? r.resenia : '',
    foto: https(r.foto), thumb: https(r.thumb), fotoPath: ruta(r.fotoPath), thumbPath: ruta(r.thumbPath),
    publica: !!r.publica, borrador: !!r.borrador, actualizado: Number(r.actualizado) || 0,
    creado: Number(r.creado) || Date.now(),
    fav: Number.isInteger(r.fav) ? r.fav : null,
    comentarios: Array.isArray(r.comentarios) ? r.comentarios.filter(c => c && typeof c.texto === 'string').map(c => ({
      id: String(c.id || nuevoId()).replace(/[^a-z0-9-]/gi, '') || nuevoId(),
      texto: c.texto.slice(0, 5000),
      fecha: Number(c.fecha) || Date.now()
    })) : []
  };
}

// Una fila de la tabla "reviews" -> una reseña de la app
function desdeFila(f) {
  return normalizar({
    id: f.id, titulo: f.titulo, categoria: f.categoria, generos: f.generos, fecha: f.fecha, descripcion: f.descripcion,
    nota: f.nota, veredicto: f.veredicto, resenia: f.resenia, fotoPath: f.foto_path, thumbPath: f.thumb_path,
    foto: urlFoto(f.foto_path), thumb: urlFoto(f.thumb_path), fav: f.fav, publica: f.publica, borrador: f.borrador, actualizado: Date.parse(f.updated_at), creado: Date.parse(f.created_at)
  });
}

/* =====================================================================
   4. ESTADO
   ===================================================================== */
const estado = {
  items: [], borradoresNube: [], borradoresLocales: [], borradorNube: null, bor: { local: 0, nube: 0 }, sesion: null, cargando: true, sinConexion: false, iniciado: false, guardando: false, locales: 0,
  cat: 'todo', q: '', orden: 'recientes', topTab: 'favoritas', topCat: 'todo', topGen: 'todos', ed: null, semillas: [], semTabla: null, sem: null, semTipo: ''
};
const porId = id => estado.items.find(x => x.id === id) || estado.borradoresNube.find(x => x.id === id);
const claveCopia = () => 'items-' + (estado.sesion ? estado.sesion.id : 'anon');

async function cargarItems() {
  if (!sb) throw new Error('sin cliente');
  const r = await sb.from('reviews').select('*').order('created_at', { ascending: false });
  if (r.error) throw r.error;
  const todas = r.data.map(desdeFila);
  if (r.data.length) estado.borradorNube = ('borrador' in r.data[0]);   // sin la columna, los borradores quedan solo en este aparato
  estado.items = todas.filter(x => !x.borrador);
  estado.borradoresNube = todas.filter(x => x.borrador);
  estado.sinConexion = false;
  Copia.escribir(claveCopia(), estado.items);
}

async function refrescar() {
  estado.cargando = true;
  try { await cargarItems(); }
  catch (e) {
    console.error(e);
    estado.sinConexion = true;
    if (!estado.items.length) { const c = await Copia.leer(claveCopia()); if (c) estado.items = c.map(normalizar); }
  }
  try { await cargarSemillas(); }
  catch (e) {
    console.error(e);
    if (!estado.semillas.length) { const c = await Copia.leer(claveSem()); if (c) estado.semillas = c.map(normSem); }
  }
  estado.cargando = false;
}

async function cargarComentarios(id) {
  const it = porId(id); if (!it || !sb) return;
  const r = await sb.from('comments').select('*').eq('review_id', id).order('created_at', { ascending: true });
  if (r.error) throw r.error;
  it.comentarios = r.data.map(c => ({ id: c.id, texto: c.texto, fecha: Date.parse(c.created_at) }));
}

/* =====================================================================
   5. PIEZAS DE PANTALLA
   ===================================================================== */
function portada(it, grande) {
  const src = grande ? (it.foto || it.thumb) : (it.thumb || it.foto);
  if (src) return '<img src="' + esc(src) + '" alt="" loading="lazy">';
  const h = 165 + (hash(it.titulo) % 50);
  return '<div class="ph" style="--h:' + h + '"><span class="ph-cat">' + esc(catNombre(it.categoria)) + '</span><span class="ph-t">' + esc(it.titulo) + '</span></div>';
}

function tarjeta(it) {
  const nv = nivel(it.nota);
  const anio = it.fecha ? it.fecha.slice(0, 4) : '';
  return '<a class="card" href="#r-' + it.id + '" style="--vc:' + nv.color + '">' +
    '<div class="poster">' + portada(it) + '<span class="nota-b">' + it.nota.toFixed(1) + '</span>' + (!it.publica ? '<span class="tag-priv">Privada</span>' : '') + '</div>' +
    '<div class="card-b"><span class="card-cat">' + esc(catNombre(it.categoria)) + (anio ? ' · ' + esc(anio) : '') + '</span>' +
    '<h3>' + esc(it.titulo) + '</h3>' +
    '<div class="card-s">' + plones(it.nota, 'chico') + '<span class="palabra">' + nv.nombre + '</span></div></div></a>';
}

function filtrados() {
  const q = norm(estado.q.trim());
  const l = estado.items.filter(function (it) {
    if (estado.cat !== 'todo' && it.categoria !== estado.cat) return false;
    if (!q) return true;
    return norm([it.titulo, catNombre(it.categoria), it.generos.join(' '), it.descripcion, it.veredicto].join(' ')).indexOf(q) >= 0;
  });
  const o = estado.orden;
  l.sort(function (a, b) {
    if (o === 'mejor') return b.nota - a.nota || b.creado - a.creado;
    if (o === 'peor') return a.nota - b.nota || b.creado - a.creado;
    if (o === 'az') return a.titulo.localeCompare(b.titulo, 'es');
    return b.creado - a.creado;
  });
  return l;
}

// La función destacada es la reseña más reciente; solo sale cuando no hay búsqueda ni filtros.
function destacadaItem() {
  if (estado.q.trim() || estado.cat !== 'todo' || estado.orden !== 'recientes') return null;
  const l = filtrados();
  return l.length >= 2 ? l[0] : null;
}
function destacadaHTML() {
  const it = destacadaItem(); if (!it) return '';
  const nv = nivel(it.nota), src = it.thumb || it.foto, anio = it.fecha ? it.fecha.slice(0, 4) : '';
  return '<a class="dest" href="#r-' + it.id + '" style="--vc:' + nv.color + '">' +
    (src ? '<span class="fondo-bl" style="background-image:url(&quot;' + esc(src) + '&quot;)"></span>' : '') +
    '<span class="poster">' + portada(it) + '<span class="nota-b">' + it.nota.toFixed(1) + '</span>' + (!it.publica ? '<span class="tag-priv">Privada</span>' : '') + '</span>' +
    '<span class="dest-info"><span class="dest-ey">Última función</span><span class="dest-t">' + esc(it.titulo) + '</span>' +
    '<span class="meta">' + esc(catNombre(it.categoria)) + (anio ? ' · ' + esc(anio) : '') + '</span>' +
    '<span class="card-s">' + plones(it.nota, 'chico') + '<span class="palabra">' + nv.nombre + '</span></span>' +
    (it.veredicto ? '<span class="dest-v">' + esc(it.veredicto) + '</span>' : '') +
    '<span class="dest-ir">Leer reseña →</span></span></a>';
}
function borradoresHTML() {
  const l = estado.sesion ? listaBorradores() : [];
  if (!l.length) return '';
  return '<section class="bors" aria-label="Borradores"><h2 class="sec" style="margin-top:6px">Borradores</h2><ul class="bor-l">' + l.map(function (d) {
    return '<li><a class="bor-a" href="#' + (d.nube || d.cambios ? 'editar-' : 'borrador-') + d.id + '"><b>' + esc(d.titulo || 'Sin título') + '</b>' +
      '<small>' + (d.cambios ? 'Cambios sin guardar · ' : '') + esc(catNombre(d.categoria)) + ' · ' + hace(d.hora) + (d.nube ? ' · en la nube' : ' · solo en este aparato') + '</small></a>' +
      '<button class="link-b" data-action="bor-borrar" data-id="' + d.id + '">Borrar</button></li>';
  }).join('') + '</ul></section>';
}

function gridHTML() {
  const d = destacadaItem();
  let l = filtrados();
  if (d) l = l.slice(1);
  if (l.length) return l.map(tarjeta).join('');
  if (estado.cargando && !estado.items.length) return '<div class="vacio-box"><strong>Cargando reseñas…</strong></div>';
  if (!estado.items.length) {
    if (estado.sinConexion) return '<div class="vacio-box"><strong>Sin conexión.</strong><span>Todavía no hay una copia guardada en este aparato. Conéctate a internet para ver las reseñas.</span><button class="btn prim" data-action="reintentar">Reintentar</button></div>';
    return estado.sesion
      ? '<div class="vacio-box"><strong>Aquí van a vivir tus reseñas.</strong><span>Agrega la primera: una peli, un álbum, un libro o un partido.</span><a class="btn prim" href="#agregar">Agregar reseña</a></div>'
      : '<div class="vacio-box"><strong>Todavía no hay reseñas públicas.</strong><span>Vuelve pronto.</span></div>';
  }
  return '<div class="vacio-box"><strong>No hay nada por aquí.</strong><span>' + (estado.q ? 'Ninguna reseña coincide con «' + esc(estado.q) + '».' : 'Todavía no hay reseñas en esta categoría.') + '</span></div>';
}
function pintarGrid() {
  const g = $('#grid'); if (g) g.innerHTML = gridHTML();
  const d = $('#destacada'); if (d) d.innerHTML = destacadaHTML();
}

function viento(texto, hecho) {

  if (!ctx || reducido() || !window.requestAnimationFrame) return operacion();
  const op = operacion();

    let ov = null;

    const W = window.innerWidth, H = window.innerHeight, dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); cv.className = 'viento-cv';

    const msg = document.createElement('p'); msg.className = 'viento-msg'; msg.textContent = 'Se lo llevó el viento.';
    ov.appendChild(cv); ov.appendChild(msg); document.body.appendChild(ov);
    requestAnimationFrame(function () { ov.classList.add('on'); });
    // el texto, partido en renglones
    const anchoMax = Math.min(340, W - 64), lh = 32;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.font = '300 24px Outfit, Inter, system-ui, sans-serif';
    const palabras = String(texto || 'Algo que ya no está').replace(/\s+/g, ' ').trim().slice(0, 180).split(' ');
    let lineas = [], cur = '';

    });

    const y0 = Math.max(24, H * .4 - lineas.length * lh / 2);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    lineas.forEach(function (l, i) { ctx.fillText(l, W / 2, y0 + i * lh); });
    const bx = Math.max(0, Math.floor((W / 2 - anchoMax / 2 - 12) * dpr)), by = Math.max(0, Math.floor((y0 - 6) * dpr));
    const bw = Math.min(cv.width - bx, Math.ceil((anchoMax + 24) * dpr)), bh = Math.min(cv.height - by, Math.ceil((lineas.length * lh + 14) * dpr));
    const px = [];

    const R = (a, b) => a + Math.random() * (b - a), INI = .55;
    const col = ['#f2ead8', '#f2ead8', '#f2ead8', '#ff9a3c', '#ffb066', '#c06ad6'];
    const pts = px.map(function (p) {
      return { x: p[0], y: p[1], ret: INI + (xmax > xmin ? (p[0] - xmin) / (xmax - xmin) : 0) * 1.3 + Math.random() * .5, vida: R(1.4, 2.5), vx: R(40, 100), ax: R(220, 340), vy: -R(8, 48), f: R(0, 6.28), c: col[Math.floor(Math.random() * col.length)] };
    });
    const cp = ['#e6a7ee', '#c06ad6', '#e24cc2', '#f3c4f6'];
    const petalos = [];
    for (let i = 0; i < 16; i++) petalos.push({ x: R(xmin - 20, xmin + (xmax - xmin) * .7), y: R(y0 - 20, y0 + lineas.length * lh), t0: R(.2, 2.1), vida: R(1.6, 2.6), vx: R(90, 190), vy: -R(10, 70), rot: R(0, 6.28), vr: R(-3.2, 3.2), c: i < 12 ? cp[i % 4] : '#47b88c', h: i < 12 ? 1 : .8 });

    } catch (e) {   // si algo falla al dibujar, se borra igual y sin efecto

}

    nota: base ? base.nota : null, publica: base ? base.publica : false, abierta: !!(base && base.nota != null),
    base: base, ruta: ruta, tocado: false, recuperado: 0

async function restaurarSemilla() {
  const s = estado.sem; if (!s || !estado.sesion) return;
  const reg = await Copia.leer(claveSemBor(s));
  if (estado.sem !== s || s.tocado || !reg || !reg.datos) return;
  if (s.base && reg.hora <= (s.base.actualizado || 0)) { Copia.borrar(claveSemBor(s)); return; }
  const d = reg.datos;
  s.titulo = d.titulo || ''; s.contenido = d.contenido || ''; s.nota = d.nota == null ? null : Number(d.nota); s.publica = !!d.publica; s.abierta = s.nota != null; s.recuperado = reg.hora;

function errorSem(t) { const e = $('#s-error'); if (!e) { toast(t); return; } e.textContent = t; e.hidden = false; }
async function guardarSemilla() {
  const s = estado.sem; if (!s || s.faltante || estado.guardando) return;
  if (!estado.sesion || !sb) { errorSem('Necesitas iniciar sesión para guardar.'); return; }
  const titulo = ($('#s-titulo').value || '').trim().slice(0, 200), contenido = ($('#s-texto').value || '').trim().slice(0, 30000);
  if (!titulo && !contenido) { errorSem('Escribe algo para poder sembrarlo.'); return; }
  if (estado.semTabla === false) { errorSem('Falta crear la tabla del diario en la nube. Mira Ajustes.'); return; }
  const btn = $('#s-guardar'); estado.guardando = true;
  if (btn) { btn.disabled = true; btn.textContent = 'Sembrando…'; }
  const fila = { tipo: s.tipo, titulo: titulo, contenido: contenido, nota: s.nota, publica: s.publica };

  }
}

/* ---------- Rankings ---------- */
function listaFavs() { return estado.items.filter(i => i.fav != null).sort((a, b) => a.fav - b.fav); }
function listaTop(modo) {
  const l = estado.items.filter(it => (estado.topCat === 'todo' || it.categoria === estado.topCat) && (estado.topGen === 'todos' || it.generos.indexOf(estado.topGen) >= 0));
  const desempate = (a, b) => (a.fav == null ? 1e9 : a.fav) - (b.fav == null ? 1e9 : b.fav) || a.creado - b.creado;
  l.sort(modo === 'mejores' ? (a, b) => b.nota - a.nota || desempate(a, b) : (a, b) => a.nota - b.nota || desempate(a, b));
  return l.slice(0, TOPE_TOP);
}
function filaRank(it, pos, ctrl) {
  const nv = nivel(it.nota);
  return '<li style="--vc:' + nv.color + '"><a class="rk-main" href="#r-' + it.id + '"><span class="rk-n">' + pos + '</span><span class="rk-th">' + portada(it) + '</span>' +
    '<span class="rk-t"><b>' + esc(it.titulo) + '</b><small>' + esc(catNombre(it.categoria)) + (it.generos.length ? ' · ' + esc(it.generos.join(', ')) : '') + '</small>' +
    '<span class="rk-s">' + plones(it.nota, 'chico') + '<span class="palabra">' + it.nota.toFixed(1) + ' · ' + nv.nombre + '</span></span></span></a>' + (ctrl || '') + '</li>';
}
const FLECHA_ARRIBA = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>';
const FLECHA_ABAJO = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
const EQUIS = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const MAS = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';

function vistaTop() {
  const t = estado.topTab, dueno = !!estado.sesion;
  const sub = [['favoritas', 'Favoritas'], ['mejores', 'Mejores'], ['peores', 'Peores']]
    .map(x => '<button class="chip" aria-pressed="' + (t === x[0]) + '" data-action="top-tab" data-tab="' + x[0] + '">' + x[1] + '</button>').join('');
  let cuerpo = '';
  if (t === 'favoritas') {
    const f = listaFavs();
    cuerpo = '<p class="ayuda" style="margin-bottom:14px">' + (dueno ? 'Tu orden manual, hasta ' + TOPE_TOP + ' puestos. Ahora tienes ' + f.length + '.' : 'Las favoritas de Juancho, en su orden.') + '</p>';
    if (!f.length) {
      cuerpo += '<div class="vacio-box"><strong>Todavía no hay favoritas.</strong><span>' + (dueno ? 'Abre una reseña y toca «Agregar a favoritas», o elige una de las candidatas de abajo.' : 'Vuelve pronto.') + '</span></div>';
    } else {
      cuerpo += '<ol class="rk">' + f.map((it, i) => filaRank(it, i + 1, dueno
        ? '<div class="rk-ctrl"><button class="ib" data-action="fav-up" data-id="' + it.id + '" aria-label="Subir un puesto"' + (i === 0 ? ' disabled' : '') + '>' + FLECHA_ARRIBA + '</button>' +
          '<button class="ib" data-action="fav-down" data-id="' + it.id + '" aria-label="Bajar un puesto"' + (i === f.length - 1 ? ' disabled' : '') + '>' + FLECHA_ABAJO + '</button>' +
          '<button class="ib" data-action="fav-quitar" data-id="' + it.id + '" aria-label="Quitar de favoritas">' + EQUIS + '</button></div>'
        : '')).join('') + '</ol>';
    }
    const cand = dueno ? estado.items.filter(i => i.fav == null && i.nota >= 4.5).sort((a, b) => b.nota - a.nota).slice(0, 10) : [];
    if (cand.length) {
      cuerpo += '<h2 class="sec">Candidatas</h2><p class="ayuda" style="margin-bottom:12px">Reseñas con 4.5 o más que todavía no están en tu top.</p><ol class="rk">' +
        cand.map(it => filaRank(it, '·', '<div class="rk-ctrl"><button class="ib" data-action="fav-add" data-id="' + it.id + '" aria-label="Agregar a favoritas">' + MAS + '</button></div>')).join('') + '</ol>';
    }
  } else {
    const delCat = estado.items.filter(it => estado.topCat === 'todo' || it.categoria === estado.topCat);
    const gens = Array.from(new Set(delCat.reduce((a, it) => a.concat(it.generos), []))).sort((a, b) => a.localeCompare(b, 'es'));
    const ocat = [['todo', 'Todas las categorías']].concat(CATEGORIAS.map(c => [c.id, c.nombre]))
      .map(c => '<option value="' + c[0] + '"' + (estado.topCat === c[0] ? ' selected' : '') + '>' + c[1] + '</option>').join('');
    const ogen = '<option value="todos">Todos los géneros</option>' + gens.map(g => '<option value="' + esc(g) + '"' + (estado.topGen === g ? ' selected' : '') + '>' + esc(g) + '</option>').join('');
    const l = listaTop(t);
    cuerpo = '<div class="filtros"><div><label class="vh" for="top-cat">Categoría</label><select id="top-cat" class="in">' + ocat + '</select></div>' +
      '<div><label class="vh" for="top-gen">Género</label><select id="top-gen" class="in">' + ogen + '</select></div></div>' +
      (l.length ? '<ol class="rk">' + l.map((it, i) => filaRank(it, i + 1, '')).join('') + '</ol>'
        : '<div class="vacio-box"><strong>Nada para mostrar.</strong><span>Prueba con otra categoría o género.</span></div>');
  }
  return '<h1 class="pag">Rankings</h1><div class="sub" role="group" aria-label="Tipo de ranking">' + sub + '</div>' + cuerpo;
}

function render(cambioDeRuta) {

    detenerBienvenida();

    iniciarBienvenida();
    return;
  }
  if (!h && !cambioDeRuta && document.querySelector('.bienvenida')) return;   // la bienvenida no se repite sola
  detenerBienvenida();
  const rutaSem = h.indexOf('sembrar-') === 0 || h.indexOf('semilla-') === 0;
  if (estado.sem && $('#fs')) flushSem();
  if (!rutaSem) estado.sem = null;
  if (estado.ed && $('#f')) flushBorrador();   // lo escrito se guarda antes de cambiar de pantalla
  document.body.classList.remove('escribiendo'); estado.escHist = false; cerrarHoja('hoja-gen'); cerrarHoja('hoja-enc');
  const rutaEditor = h === 'agregar' || h.indexOf('editar-') === 0 || h.indexOf('borrador-') === 0;
  if (rutaEditor && estado.iniciado && !estado.sesion) { location.hash = '#entrar'; return; }
  if (h === 'entrar' && estado.sesion) { location.hash = '#ajustes'; return; }
  if (h.indexOf('sembrar-') === 0 && estado.iniciado && !estado.sesion) { location.hash = '#entrar'; return; }
  let html = '', sec = '';
  document.body.classList.toggle('en-bienvenida', !h);
  if (!h) { html = vistaBienvenida(); }
  else if (h === 'inicio') {
    if (!estado.iniciado) html = '<p class="ayuda">Cargando…</p>';
    else if (!estado.sesion && estado.entrando) html = '<p class="ayuda">Cargando…</p>';
    else if (!estado.sesion) { location.replace('#cartelera'); return; }
    else html = vistaSembrar();
    sec = 'inicio';
  }
  else if (h === 'cartelera') { html = vistaCartelera(); sec = 'cartelera'; }
  else if (h === 'diario') { html = vistaDiario(); sec = 'diario'; }
  else if (rutaSem && !estado.iniciado) { html = '<p class="ayuda">Cargando…</p>'; sec = 'inicio'; }
  else if (h.indexOf('sembrar-') === 0) { if (cambioDeRuta || !estado.sem) iniciarSemilla(h.slice(8)); html = vistaSemilla(); sec = 'inicio'; }
  else if (h.indexOf('semilla-') === 0) { if (cambioDeRuta || !estado.sem) iniciarSemilla(null, h.slice(8)); html = vistaSemilla(); sec = 'diario'; }
  else if (rutaEditor && !estado.iniciado) { html = '<p class="ayuda">Cargando…</p>'; sec = 'agregar'; }
  else if (h === 'agregar') { if (cambioDeRuta || !estado.ed) iniciarEditor(null); html = vistaEditor(); sec = 'agregar'; }
  else if (h.indexOf('editar-') === 0) { if (cambioDeRuta || !estado.ed) iniciarEditor(h.slice(7)); html = estado.ed && estado.ed.base ? vistaEditor() : vistaDetalle(''); sec = 'agregar'; }
  else if (h.indexOf('borrador-') === 0) {
    const ex = porId(h.slice(9)); if (ex) { location.hash = '#editar-' + ex.id; return; }
    if (cambioDeRuta || !estado.ed) iniciarEditor(null, h.slice(9));
    html = vistaEditor(); sec = 'agregar';
  }
  else if (h === 'top') { html = vistaTop(); sec = 'top'; }
  else if (h === 'ajustes') { html = vistaAjustes(); sec = 'ajustes'; }
  else if (h === 'entrar') { html = vistaEntrar(); sec = 'ajustes'; }
  else if (h === 'olvide') { if (cambioDeRuta && !avisoLink) estado.olvideEnviado = false; html = vistaOlvide(); sec = 'ajustes'; }
  else if (h === 'nueva-clave') { html = estado.iniciado ? vistaClave() : '<p class="ayuda">Cargando…</p>'; sec = 'ajustes'; }
  else if (h.indexOf('r-') === 0) { html = vistaDetalle(h.slice(2)); sec = 'inicio'; }
  else { location.hash = '#inicio'; return; }
  $('#vista').innerHTML = html;
  document.querySelectorAll('#nav .nav-i').forEach(a => {
    if (a.dataset.sec === sec) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  if (cambioDeRuta) window.scrollTo(0, 0);
  medirNav();
  const di = $('.d-img'); if (di && di.complete) ajustarImgDetalle(di);
  if (!h) iniciarBienvenida();
  if (rutaSem && $('#s-texto')) {
    autoTam($('#s-texto')); contarSem(); pintarEstadoSem();
    if (cambioDeRuta && h.indexOf('sembrar-') === 0) setTimeout(function () { const t = $('#s-texto'); if (t && document.activeElement !== t) { try { t.focus({ preventScroll: true }); } catch (e) { /* nada */ } } }, 60);
  }

    cargarComentarios(rid).then(function () { if (location.hash === '#r-' + rid) pintarComentarios(porId(rid)); }).catch(function () { /* se queda sin comentarios */ });
  }

async function sincronizarFavs(cambios) {
  const rs = await Promise.all(cambios.map(c => sb.from('reviews').update({ fav: c[1] }).eq('id', c[0])));
  const mal = rs.find(r => r.error);
  if (mal) throw mal.error;
  Copia.escribir(claveCopia(), estado.items);
}
async function renumerarFavs() {
  const cambios = [];
  listaFavs().forEach((it, i) => { if (it.fav !== i + 1) { it.fav = i + 1; cambios.push([it.id, it.fav]); } });
  if (cambios.length) await sincronizarFavs(cambios);
}
async function agregarFav(id) {
  const it = porId(id), l = listaFavs();
  if (!it || it.fav != null) return false;
  if (l.length >= TOPE_TOP) { toast('Tu top ' + TOPE_TOP + ' está lleno. Quita una favorita primero.'); return false; }
  it.fav = l.length + 1;
  await sincronizarFavs([[id, it.fav]]);
  return true;
}
async function quitarFav(id) {
  const it = porId(id); if (!it) return;
  it.fav = null;
  await sincronizarFavs([[id, null]]);
  await renumerarFavs();
}
async function moverFav(id, dir) {
  const l = listaFavs(), i = l.findIndex(x => x.id === id), j = i + dir;
  if (i < 0 || j < 0 || j >= l.length) return;
  const a = l[i], b = l[j], t = a.fav;
  a.fav = b.fav; b.fav = t;
  await sincronizarFavs([[a.id, a.fav], [b.id, b.fav]]);
}

async function borrarItem(id) {
  const it = porId(id); if (!it) return;
  const r = await sb.from('reviews').delete().eq('id', id);
  if (r.error) throw r.error;
  const rutas = [it.fotoPath, it.thumbPath].filter(Boolean);
  if (rutas.length) sb.storage.from(BUCKET).remove(rutas);
  estado.items = estado.items.filter(x => x.id !== id);

}

/* ---------- Fotos ---------- */
function cargarImagen(archivo) {
  return new Promise(function (ok, mal) {
    const url = URL.createObjectURL(archivo);
    const img = new Image();
    img.onload = function () { img._url = url; ok(img); };   // quien la use revoca el URL cuando termine
    img.onerror = function () { URL.revokeObjectURL(url); mal(new Error('imagen')); };
    img.src = url;
  });
}
function aBlob(img, max, calidad) {
  return new Promise(function (ok, mal) {
    const f = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.width * f)); c.height = Math.max(1, Math.round(img.height * f));
    const x = c.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);   // las fotos PNG con fondo transparente quedan en blanco
    x.drawImage(img, 0, 0, c.width, c.height);
    c.toBlob(function (b) { b ? ok(b) : mal(new Error('blob')); }, 'image/jpeg', calidad);
  });
}
// Recorte de afiche (2:3) para la cartelera. Sin encuadre elegido, se centra solo.
function recorteAfiche(img, enc) {
  return new Promise(function (ok, mal) {
    const W = 480, H = 720, nw = img.naturalWidth || img.width, nh = img.naturalHeight || img.height;
    let sx, sy, sw, sh;
    if (enc) { const sc = Math.max(enc.w / nw, enc.h / nh) * enc.zoom; sx = -enc.x / sc; sy = -enc.y / sc; sw = enc.w / sc; sh = enc.h / sc; }
    else { const sc = Math.max(W / nw, H / nh); sw = W / sc; sh = H / sc; sx = (nw - sw) / 2; sy = (nh - sh) / 2; }
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    try {
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
      x.drawImage(img, sx, sy, sw, sh, 0, 0, W, H);
      c.toBlob(function (b) { b ? ok(b) : mal(new Error('blob')); }, 'image/jpeg', 0.8);
    } catch (e) { mal(e); }
  });
}
// De una foto salen dos: la grande (con su forma original, máximo 1200 px) y el afiche para las tarjetas (2:3).
async function procesarFoto(archivo) {
  const img = await cargarImagen(archivo);
  try { return { full: await aBlob(img, 1200, 0.82), thumb: await recorteAfiche(img, null) }; }
  finally { if (img._url) URL.revokeObjectURL(img._url); }
}
async function subirFoto(ruta, blob) {
  const r = await sb.storage.from(BUCKET).upload(ruta, blob, { contentType: 'image/jpeg', cacheControl: '31536000' });
  if (r.error) throw r.error;
}

function mostrarError(msg, selector) {

// Lo que escribes se guarda solo en este aparato. Las reseñas nuevas también se copian a la nube como "borrador"
// (eso pide un cambio pequeño en la base de datos: está en Ajustes). Las reseñas ya publicadas solo guardan cambios aquí.
const claveBor = id => 'bor-' + (estado.sesion ? estado.sesion.id : 'anon') + '-' + id;
const SQL_BORRADORES = 'alter table public.reviews add column if not exists borrador boolean not null default false;\n\n' +
  'drop policy if exists "reviews: publicas para todos" on public.reviews;\n' +
  'create policy "reviews: publicas para todos" on public.reviews\n  for select to anon, authenticated\n  using (publica = true and borrador = false);\n\n' +
  'create index if not exists reviews_borrador_idx on public.reviews (user_id, borrador);';

function hace(ms) {
  const m = Math.max(0, Math.round((Date.now() - ms) / 60000));
  if (m < 1) return 'ahora mismo';
  if (m < 60) return 'hace ' + m + ' min';
  const h = Math.round(m / 60);
  if (h < 24) return 'hace ' + h + (h === 1 ? ' hora' : ' horas');
  const d = Math.round(h / 24);
  return 'hace ' + d + (d === 1 ? ' día' : ' días');
}
async function cargarBorradoresLocales() {
  estado.borradoresLocales = [];
  if (!estado.sesion) return;
  const pref = 'bor-' + estado.sesion.id + '-';
  try {
    const todos = await Copia.todos();
    estado.borradoresLocales = todos.filter(x => x && typeof x.k === 'string' && x.k.indexOf(pref) === 0 && x.v && x.v.datos).map(x => x.v);
  } catch (e) { estado.borradoresLocales = []; }
}
// Une los borradores de la nube y los de este aparato en una sola lista.
function listaBorradores() {
  const mapa = new Map();
  estado.borradoresNube.forEach(it => mapa.set(it.id, { id: it.id, titulo: it.titulo, categoria: it.categoria, hora: it.actualizado || it.creado, nube: true, cambios: false }));
  estado.borradoresLocales.forEach(function (r) {
    const d = r.datos || {}, pub = estado.items.find(x => x.id === r.id), ya = mapa.get(r.id);
    if (ya) { if (r.hora > ya.hora) { ya.hora = r.hora; ya.titulo = d.titulo || ya.titulo; } return; }
    mapa.set(r.id, { id: r.id, titulo: d.titulo || (pub ? pub.titulo : ''), categoria: d.categoria || 'otros', hora: r.hora, nube: false, cambios: !!pub });
  });
  return Array.from(mapa.values()).sort((a, b) => b.hora - a.hora);
}
function recogerDatos() {
  const ed = estado.ed, val = sel => { const e = $(sel); return e ? e.value : ''; }, r = $('#f-resenia');
  return {
    titulo: val('#f-titulo'), categoria: ed.categoria, generos: ed.generos.slice(), fecha: val('#f-fecha'), descripcion: val('#f-desc'),
    nota: ed.nota, veredicto: val('#f-veredicto'), resenia: r ? limpiar(r.innerHTML) : '', publica: ed.publica
  };
}
function datosVacios(d, ed) {
  return !d.titulo.trim() && !d.descripcion.trim() && !d.veredicto.trim() && !textoPlano(d.resenia).trim() && !ed.generos.length && !ed.nuevaFoto;
}
function pintarEstadoBor() {
  const b = estado.bor, partes = [];
  if (b.local) partes.push('Guardado en este aparato ' + hace(b.local));
  if (b.nube) partes.push('y en la nube');
  else if (estado.borradorNube === false && b.local) partes.push('(la nube de borradores está apagada, mira Ajustes)');
  const t = partes.join(' ') || 'Se guarda solo mientras escribes';
  document.querySelectorAll('.bor-estado').forEach(e => { e.textContent = t; });

function guardarBorradorLocal() {

/* ---------- Guardar una reseña ---------- */
async function guardarFormulario() {
  const ed = estado.ed; if (!ed || estado.guardando) return;
  if (!estado.sesion || !sb) { mostrarError('Necesitas iniciar sesión para guardar.'); return; }
  const titulo = $('#f-titulo').value.trim();
  if (!titulo) { mostrarError('Escribe el nombre para poder guardar.', '#f-titulo'); return; }
  const btn = $('#f-guardar');
  estado.guardando = true;
  if (btn) { btn.disabled = true; btn.textContent = 'Guardando…'; }
  const b = ed.base, id = ed.id || nuevoId(), uid = estado.sesion.id;
  const viejos = [], subidas = [];
  let fotoPath = b ? b.fotoPath : null, thumbPath = b ? b.thumbPath : null;
  try {
    if (ed.nuevaFoto) {
      const sello = Date.now().toString(36);
      const pf = uid + '/' + id + '/' + sello + '-g.jpg', pt = uid + '/' + id + '/' + sello + '-m.jpg';
      if (ed.nuevaFoto.full) {   // si solo se reencuadró, la foto grande se queda como está
        await subirFoto(pf, ed.nuevaFoto.full); subidas.push(pf);
        if (fotoPath) viejos.push(fotoPath);
        fotoPath = pf;
      }
      await subirFoto(pt, ed.nuevaFoto.thumb); subidas.push(pt);
      if (thumbPath) viejos.push(thumbPath);
      thumbPath = pt;
    } else if (!ed.foto && fotoPath) {
      viejos.push(fotoPath); if (thumbPath) viejos.push(thumbPath);
      fotoPath = null; thumbPath = null;
    }
    const fila = {
      titulo: titulo, categoria: ed.categoria, generos: ed.generos, fecha: $('#f-fecha').value,
      descripcion: $('#f-desc').value.trim().slice(0, 500), nota: ed.nota,
      veredicto: $('#f-veredicto').value.trim().slice(0, 120), resenia: limpiar($('#f-resenia').innerHTML),
      foto_path: fotoPath, thumb_path: thumbPath, publica: ed.publica
    };
    if (estado.borradorNube === true || ed.nubeCreada || (b && b.borrador)) fila.borrador = false;
    const existe = !!b || ed.nubeCreada;
    clearTimeout(tBorLocal); clearTimeout(tBorNube);
    const r = existe ? await sb.from('reviews').update(fila).eq('id', id) : await sb.from('reviews').insert(Object.assign({ id: id }, fila));
    if (r.error) throw r.error;
    if (viejos.length) sb.storage.from(BUCKET).remove(viejos);
    Copia.borrar(claveBor(id));
    estado.borradoresLocales = estado.borradoresLocales.filter(x => x.id !== id);
    estado.ed = null;
    try { await cargarItems(); } catch (e2) { /* se verá al volver a cargar */ }
    toast('Guardado');
    location.hash = '#r-' + id;
  } catch (e) {
    console.error(e);
    if (subidas.length) sb.storage.from(BUCKET).remove(subidas);
    mostrarError('No se pudo guardar. Revisa tu internet e intenta otra vez.');
  } finally {
    estado.guardando = false;
    const bt = $('#f-guardar'); if (bt) { bt.disabled = false; bt.textContent = 'Guardar'; }
  }
}

/* ---------- Foto: elegir, encuadrar, reencuadrar ---------- */
function abrirEncuadre(img, alAceptar) {
  const h = abrirHoja('hoja-enc', '<div class="hoja-c enc"><h2 class="hoja-t">Encuadra el afiche</h2>' +
    '<p class="ayuda">Mueve la foto con el dedo o el mouse y acércala si quieres. Así se verá en la cartelera.</p>' +
    '<div class="enc-marco" id="enc-marco"><img id="enc-img" alt="" draggable="false"></div>' +
    '<label class="vh" for="enc-zoom">Acercar</label><input id="enc-zoom" type="range" min="1" max="3" step="0.01" value="1">' +
    '<div class="hoja-pie" style="width:100%"><button type="button" class="btn prim" data-action="enc-ok">Listo</button><button type="button" class="btn" data-action="enc-cancel">Cancelar</button></div></div>');
  h.setAttribute('aria-label', 'Encuadrar el afiche');
  const marco = $('#enc-marco'), el = $('#enc-img');
  const st = { alAceptar: alAceptar, zoom: 1, x: 0, y: 0, w: marco.clientWidth || 280, h: marco.clientHeight || 420, nw: img.naturalWidth || img.width || 1, nh: img.naturalHeight || img.height || 1 };
  estado.enc = st;
  el.src = img._url || img.src;
  const base = () => Math.max(st.w / st.nw, st.h / st.nh);
  st.colocar = function () {
    const sc = base() * st.zoom, iw = st.nw * sc, ih = st.nh * sc;
    st.x = Math.min(0, Math.max(st.w - iw, st.x)); st.y = Math.min(0, Math.max(st.h - ih, st.y));
    el.style.width = iw + 'px'; el.style.height = ih + 'px'; el.style.transform = 'translate(' + st.x + 'px,' + st.y + 'px)';
  };
  st.acercar = function (z) {
    z = Math.max(1, Math.min(3, z));
    const s0 = base() * st.zoom, cx = (st.w / 2 - st.x) / s0, cy = (st.h / 2 - st.y) / s0;
    st.zoom = z; const s1 = base() * z;
    st.x = st.w / 2 - cx * s1; st.y = st.h / 2 - cy * s1;
    const zr = $('#enc-zoom'); if (zr) zr.value = z;
    st.colocar();
  };
  st.x = (st.w - st.nw * base()) / 2; st.y = (st.h - st.nh * base()) / 2; st.colocar();
  const dedos = new Map(); let dist0 = 0, zoom0 = 1;
  marco.addEventListener('pointerdown', function (e) {
    try { marco.setPointerCapture(e.pointerId); } catch (x) { /* sin captura */ }
    dedos.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (dedos.size === 2) { const p = Array.from(dedos.values()); dist0 = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y); zoom0 = st.zoom; }

  });

  marco.addEventListener('wheel', function (e) { e.preventDefault(); st.acercar(st.zoom * (e.deltaY < 0 ? 1.08 : 1 / 1.08)); }, { passive: false });
}

  try {
    const sc = $('#esc-scroll'), sel = getSelection(); if (!sc || !sel || !sel.rangeCount) return;
    let r = sel.getRangeAt(0).getBoundingClientRect();
