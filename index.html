/* ---------- Rankings ---------- */
function listaFavs() { return estado.items.filter(i => i.fav != null).sort((a, b) => a.fav - b.fav); }
function listaTop(modo) {
  const l = estado.items.filter(it => (estado.topCat === 'todo' || it.categoria === estado.topCat) && (estado.topGen === 'todos' || it.generos.indexOf(estado.topGen) >= 0));
  const desempate = (a, b) => (a.fav == null ? 1e9 : a.fav) - (b.fav == null ? 1e9 : b.fav) || a.creado - b.creado;
  l.sort(modo === 'mejores' ? (a, b) => b.nota - a.nota || desempate(a, b) : (a, b) => a.nota - b.nota || desempate(a, b));
  return l.slice(0, TOPE_TOP);
}
function filaRank(it, pos, ctrl) {
  const nv = nivel(it.nota);
  return '<li style="--vc:' + nv.color + '"><a class="rk-main" href="#r-' + it.id + '"><span class="rk-n">' + pos + '</span><span class="rk-th">' + portada(it) + '</span>' +
    '<span class="rk-t"><b>' + esc(it.titulo) + '</b><small>' + esc(catNombre(it.categoria)) + (it.generos.length ? ' · ' + esc(it.generos.join(', ')) : '') + '</small>' +
    '<span class="rk-s">' + plones(it.nota, 'chico') + '<span class="palabra">' + it.nota.toFixed(1) + ' · ' + nv.nombre + '</span></span></span></a>' + (ctrl || '') + '</li>';
}
const FLECHA_ARRIBA = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>';
const FLECHA_ABAJO = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
const EQUIS = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const MAS = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';

function vistaTop() {
  const t = estado.topTab, dueno = !!estado.sesion;
  const sub = [['favoritas', 'Favoritas'], ['mejores', 'Mejores'], ['peores', 'Peores']]
    .map(x => '<button class="chip" aria-pressed="' + (t === x[0]) + '" data-action="top-tab" data-tab="' + x[0] + '">' + x[1] + '</button>').join('');
  let cuerpo = '';
  if (t === 'favoritas') {
    const f = listaFavs();
    cuerpo = '<p class="ayuda" style="margin-bottom:14px">' + (dueno ? 'Tu orden manual, hasta ' + TOPE_TOP + ' puestos. Ahora tienes ' + f.length + '.' : 'Las favoritas de Juancho, en su orden.') + '</p>';
    if (!f.length) {
      cuerpo += '<div class="vacio-box"><strong>Todavía no hay favoritas.</strong><span>' + (dueno ? 'Abre una reseña y toca «Agregar a favoritas», o elige una de las candidatas de abajo.' : 'Vuelve pronto.') + '</span></div>';
    } else {
      cuerpo += '<ol class="rk">' + f.map((it, i) => filaRank(it, i + 1, dueno
        ? '<div class="rk-ctrl"><button class="ib" data-action="fav-up" data-id="' + it.id + '" aria-label="Subir un puesto"' + (i === 0 ? ' disabled' : '') + '>' + FLECHA_ARRIBA + '</button>' +
          '<button class="ib" data-action="fav-down" data-id="' + it.id + '" aria-label="Bajar un puesto"' + (i === f.length - 1 ? ' disabled' : '') + '>' + FLECHA_ABAJO + '</button>' +
          '<button class="ib" data-action="fav-quitar" data-id="' + it.id + '" aria-label="Quitar de favoritas">' + EQUIS + '</button></div>'
        : '')).join('') + '</ol>';
    }
    const cand = dueno ? estado.items.filter(i => i.fav == null && i.nota >= 4.5).sort((a, b) => b.nota - a.nota).slice(0, 10) : [];
    if (cand.length) {
      cuerpo += '<h2 class="sec">Candidatas</h2><p class="ayuda" style="margin-bottom:12px">Reseñas con 4.5 o más que todavía no están en tu top.</p><ol class="rk">' +
        cand.map(it => filaRank(it, '·', '<div class="rk-ctrl"><button class="ib" data-action="fav-add" data-id="' + it.id + '" aria-label="Agregar a favoritas">' + MAS + '</button></div>')).join('') + '</ol>';
    }
  } else {
    const delCat = estado.items.filter(it => estado.topCat === 'todo' || it.categoria === estado.topCat);
    const gens = Array.from(new Set(delCat.reduce((a, it) => a.concat(it.generos), []))).sort((a, b) => a.localeCompare(b, 'es'));
    const ocat = [['todo', 'Todas las categorías']].concat(CATEGORIAS.map(c => [c.id, c.nombre]))
      .map(c => '<option value="' + c[0] + '"' + (estado.topCat === c[0] ? ' selected' : '') + '>' + c[1] + '</option>').join('');
    const ogen = '<option value="todos">Todos los géneros</option>' + gens.map(g => '<option value="' + esc(g) + '"' + (estado.topGen === g ? ' selected' : '') + '>' + esc(g) + '</option>').join('');
    const l = listaTop(t);
    cuerpo = '<div class="filtros"><div><label class="vh" for="top-cat">Categoría</label><select id="top-cat" class="in">' + ocat + '</select></div>' +
      '<div><label class="vh" for="top-gen">Género</label><select id="top-gen" class="in">' + ogen + '</select></div></div>' +
      (l.length ? '<ol class="rk">' + l.map((it, i) => filaRank(it, i + 1, '')).join('') + '</ol>'
        : '<div class="vacio-box"><strong>Nada para mostrar.</strong><span>Prueba con otra categoría o género.</span></div>');
  }
  return barraTej('resenas', 'ranking') + '<h1 class="pag">Ranking</h1><div class="sub" role="group" aria-label="Tipo de ranking">' + sub + '</div>' + cuerpo;
}

/* ---------- Fotos ---------- */
function cargarImagen(archivo) {
  return new Promise(function (ok, mal) {
    const url = URL.createObjectURL(archivo);
    const img = new Image();
    img.onload = function () { img._url = url; ok(img); };   // quien la use revoca el URL cuando termine
    img.onerror = function () { URL.revokeObjectURL(url); mal(new Error('imagen')); };
    img.src = url;
  });
}
function aBlob(img, max, calidad) {
  return new Promise(function (ok, mal) {
    const f = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.width * f)); c.height = Math.max(1, Math.round(img.height * f));
    const x = c.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);   // las fotos PNG con fondo transparente quedan en blanco
    x.drawImage(img, 0, 0, c.width, c.height);
    c.toBlob(function (b) { b ? ok(b) : mal(new Error('blob')); }, 'image/jpeg', calidad);
  });
}
// Recorte de afiche (2:3) para la cartelera. Sin encuadre elegido, se centra solo.
function recorteAfiche(img, enc) {
  return new Promise(function (ok, mal) {
    const W = 480, H = 720, nw = img.naturalWidth || img.width, nh = img.naturalHeight || img.height;
    let sx, sy, sw, sh;
    if (enc) { const sc = Math.max(enc.w / nw, enc.h / nh) * enc.zoom; sx = -enc.x / sc; sy = -enc.y / sc; sw = enc.w / sc; sh = enc.h / sc; }
    else { const sc = Math.max(W / nw, H / nh); sw = W / sc; sh = H / sc; sx = (nw - sw) / 2; sy = (nh - sh) / 2; }
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    try {
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
      x.drawImage(img, sx, sy, sw, sh, 0, 0, W, H);
      c.toBlob(function (b) { b ? ok(b) : mal(new Error('blob')); }, 'image/jpeg', 0.8);
    } catch (e) { mal(e); }
  });
}
// De una foto salen dos: la grande (con su forma original, máximo 1200 px) y el afiche para las tarjetas (2:3).
async function procesarFoto(archivo) {
  const img = await cargarImagen(archivo);
  try { return { full: await aBlob(img, 1200, 0.82), thumb: await recorteAfiche(img, null) }; }
  finally { if (img._url) URL.revokeObjectURL(img._url); }
}
async function subirFoto(ruta, blob) {
  const r = await sb.storage.from(BUCKET).upload(ruta, blob, { contentType: 'image/jpeg', cacheControl: '31536000' });
  if (r.error) throw r.error;
}

function mostrarError(msg, selector) {
  const e = $('#f-error'); if (e) { e.textContent = msg; e.hidden = false; }
  if (document.body.classList.contains('escribiendo')) { toast(msg); if (selector) salirEscritura(); }
  const c = selector && $(selector); if (c) setTimeout(function () { c.focus(); }, 80);
}

// Lo que escribes se guarda solo en este aparato. Las reseñas nuevas también se copian a la nube como "borrador"
// (eso pide un cambio pequeño en la base de datos: está en Ajustes). Las reseñas ya publicadas solo guardan cambios aquí.
const claveBor = id => 'bor-' + (estado.sesion ? estado.sesion.id : 'anon') + '-' + id;
const SQL_BORRADORES = 'alter table public.reviews add column if not exists borrador boolean not null default false;\n\n' +
  'drop policy if exists "reviews: publicas para todos" on public.reviews;\n' +
  'create policy "reviews: publicas para todos" on public.reviews\n  for select to anon, authenticated\n  using (publica = true and borrador = false);\n\n' +
  'create index if not exists reviews_borrador_idx on public.reviews (user_id, borrador);';

function hace(ms) {
  const m = Math.max(0, Math.round((Date.now() - ms) / 60000));
  if (m < 1) return 'ahora mismo';
  if (m < 60) return 'hace ' + m + ' min';
  const h = Math.round(m / 60);
  if (h < 24) return 'hace ' + h + (h === 1 ? ' hora' : ' horas');
  const d = Math.round(h / 24);
  return 'hace ' + d + (d === 1 ? ' día' : ' días');
}
async function cargarBorradoresLocales() {
  estado.borradoresLocales = [];
  if (!estado.sesion) return;
  const pref = 'bor-' + estado.sesion.id + '-';
  try {
    const todos = await Copia.todos();
    estado.borradoresLocales = todos.filter(x => x && typeof x.k === 'string' && x.k.indexOf(pref) === 0 && x.v && x.v.datos).map(x => x.v);
  } catch (e) { estado.borradoresLocales = []; }
}
// Une los borradores de la nube y los de este aparato en una sola lista.
function listaBorradores() {
  const mapa = new Map();
  estado.borradoresNube.forEach(it => mapa.set(it.id, { id: it.id, titulo: it.titulo, categoria: it.categoria, hora: it.actualizado || it.creado, nube: true, cambios: false }));
  estado.borradoresLocales.forEach(function (r) {
    const d = r.datos || {}, pub = estado.items.find(x => x.id === r.id), ya = mapa.get(r.id);
    if (ya) { if (r.hora > ya.hora) { ya.hora = r.hora; ya.titulo = d.titulo || ya.titulo; } return; }
    mapa.set(r.id, { id: r.id, titulo: d.titulo || (pub ? pub.titulo : ''), categoria: d.categoria || 'otros', hora: r.hora, nube: false, cambios: !!pub });
  });
  return Array.from(mapa.values()).sort((a, b) => b.hora - a.hora);
}
function recogerDatos() {
  const ed = estado.ed, val = sel => { const e = $(sel); return e ? e.value : ''; }, r = $('#f-resenia');
  return {
    titulo: val('#f-titulo'), categoria: ed.categoria, generos: ed.generos.slice(), fecha: val('#f-fecha'), descripcion: val('#f-desc'),
    nota: ed.nota, veredicto: val('#f-veredicto'), resenia: r ? limpiar(r.innerHTML) : '', publica: ed.publica
  };
}
function datosVacios(d, ed) {
  return !d.titulo.trim() && !d.descripcion.trim() && !d.veredicto.trim() && !textoPlano(d.resenia).trim() && !ed.generos.length && !ed.nuevaFoto;
}
function pintarEstadoBor() {
  const b = estado.bor, partes = [];
  if (b.local) partes.push('Guardado en este aparato ' + hace(b.local));
  if (b.nube) partes.push('y en la nube');
  else if (estado.borradorNube === false && b.local) partes.push('(la nube de borradores está apagada, mira Ajustes)');

function guardarBorradorLocal() {
  const ed = estado.ed; if (!ed || !ed.tocado || !estado.sesion || !$('#f')) return;
  const d = recogerDatos();
  if (datosVacios(d, ed)) { Copia.borrar(claveBor(ed.id)); return; }
  const reg = { id: ed.id, hora: Date.now(), nuevo: !ed.base, datos: d, fotos: ed.nuevaFoto ? { full: ed.nuevaFoto.full || null, thumb: ed.nuevaFoto.thumb } : null };
  if (!Copia.escribir(claveBor(ed.id), reg) && reg.fotos) { reg.fotos = null; Copia.escribir(claveBor(ed.id), reg); }
  estado.bor.local = reg.hora;
  estado.borradoresLocales = estado.borradoresLocales.filter(x => x.id !== ed.id).concat([reg]);
  pintarEstadoBor();
}
async function sincronizarNube() {
  const ed = estado.ed;
  if (!ed || !ed.tocado || !estado.sesion || !sb || estado.borradorNube === false || estado.guardando || !$('#f')) return;
  if (ed.base && !ed.base.borrador) return;   // una reseña ya publicada no se pisa con un borrador
  const d = recogerDatos();
  if (datosVacios(d, ed)) return;
  const fila = {
    titulo: d.titulo.trim().slice(0, 200) || 'Sin título', categoria: d.categoria, generos: d.generos, fecha: d.fecha,
    descripcion: d.descripcion.trim().slice(0, 500), nota: d.nota, veredicto: d.veredicto.trim().slice(0, 120), resenia: d.resenia,
    publica: false, borrador: true
  };
  const existe = !!ed.base || ed.nubeCreada;
  try {
    const r = existe ? await sb.from('reviews').update(fila).eq('id', ed.id) : await sb.from('reviews').insert(Object.assign({ id: ed.id }, fila));
    if (r.error) throw r.error;
    ed.nubeCreada = true; estado.borradorNube = true; estado.bor.nube = Date.now(); pintarEstadoBor();
    const ya = estado.borradoresNube.find(x => x.id === ed.id), ahora = Date.now();
    const ent = normalizar(Object.assign({}, fila, { id: ed.id, creado: ya ? ya.creado : ahora, actualizado: ahora, fotoPath: ya ? ya.fotoPath : null, thumbPath: ya ? ya.thumbPath : null }));
    estado.borradoresNube = estado.borradoresNube.filter(x => x.id !== ed.id).concat([ent]);
  } catch (e) {
    const m = String((e && (e.message || e.code)) || '');
    if (/borrador/i.test(m) || (e && e.code === 'PGRST204')) { estado.borradorNube = false; pintarEstadoBor(); }
    else console.warn('borrador en la nube:', e);
  }
}
let tBorLocal = null, tBorNube = null;

async function restaurarBorrador() {
  const ed = estado.ed; if (!ed || !estado.sesion) return;
  const reg = await Copia.leer(claveBor(ed.id));
  if (estado.ed !== ed || ed.tocado) return;
  if (!reg || !reg.datos) {
    if (ed.deRuta && !ed.base) { toast('No encontré ese borrador.'); location.hash = '#inicio'; }
    return;
  }
  if (ed.base && reg.hora <= (ed.base.actualizado || 0)) { Copia.borrar(claveBor(ed.id)); return; }   // lo de la nube es más nuevo
  const d = reg.datos;
  ed.vals = { titulo: d.titulo || '', fecha: d.fecha || '', descripcion: d.descripcion || '', veredicto: d.veredicto || '', resenia: d.resenia || '' };
  ed.categoria = CATEGORIAS.some(c => c.id === d.categoria) ? d.categoria : ed.categoria;
  ed.generos = Array.isArray(d.generos) ? d.generos.slice(0, 12) : ed.generos;

  ed.publica = !!d.publica;
  if (reg.fotos && reg.fotos.thumb) {

    try { ed.foto = URL.createObjectURL(reg.fotos.full || reg.fotos.thumb); } catch (e) { /* sin vista previa */ }
  }
  ed.recuperado = reg.hora;
  estado.bor.local = reg.hora;
  if (location.hash.slice(1) === (ed.deRuta ? 'borrador-' + ed.id : (ed.base ? 'editar-' + ed.id : 'agregar'))) render(false);
}

/* ---------- Foto: elegir, encuadrar, reencuadrar ---------- */
function abrirEncuadre(img, alAceptar) {
  const h = abrirHoja('hoja-enc', '<div class="hoja-c enc"><h2 class="hoja-t">Encuadra el afiche</h2>' +
    '<p class="ayuda">Mueve la foto con el dedo o el mouse y acércala si quieres. Así se verá en la cartelera.</p>' +
    '<div class="enc-marco" id="enc-marco"><img id="enc-img" alt="" draggable="false"></div>' +
    '<label class="vh" for="enc-zoom">Acercar</label><input id="enc-zoom" type="range" min="1" max="3" step="0.01" value="1">' +
    '<div class="hoja-pie" style="width:100%"><button type="button" class="btn prim" data-action="enc-ok">Listo</button><button type="button" class="btn" data-action="enc-cancel">Cancelar</button></div></div>');
  h.setAttribute('aria-label', 'Encuadrar el afiche');
  const marco = $('#enc-marco'), el = $('#enc-img');
  const st = { alAceptar: alAceptar, zoom: 1, x: 0, y: 0, w: marco.clientWidth || 280, h: marco.clientHeight || 420, nw: img.naturalWidth || img.width || 1, nh: img.naturalHeight || img.height || 1 };
  estado.enc = st;
  el.src = img._url || img.src;
  const base = () => Math.max(st.w / st.nw, st.h / st.nh);
  st.colocar = function () {
    const sc = base() * st.zoom, iw = st.nw * sc, ih = st.nh * sc;
    st.x = Math.min(0, Math.max(st.w - iw, st.x)); st.y = Math.min(0, Math.max(st.h - ih, st.y));
    el.style.width = iw + 'px'; el.style.height = ih + 'px'; el.style.transform = 'translate(' + st.x + 'px,' + st.y + 'px)';
  };
  st.acercar = function (z) {
    z = Math.max(1, Math.min(3, z));
    const s0 = base() * st.zoom, cx = (st.w / 2 - st.x) / s0, cy = (st.h / 2 - st.y) / s0;
    st.zoom = z; const s1 = base() * z;
    st.x = st.w / 2 - cx * s1; st.y = st.h / 2 - cy * s1;
    const zr = $('#enc-zoom'); if (zr) zr.value = z;
    st.colocar();
  };
  st.x = (st.w - st.nw * base()) / 2; st.y = (st.h - st.nh * base()) / 2; st.colocar();
  const dedos = new Map(); let dist0 = 0, zoom0 = 1;
  marco.addEventListener('pointerdown', function (e) {
    try { marco.setPointerCapture(e.pointerId); } catch (x) { /* sin captura */ }
    dedos.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (dedos.size === 2) { const p = Array.from(dedos.values()); dist0 = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y); zoom0 = st.zoom; }
  });
  marco.addEventListener('pointermove', function (e) {
    const d = dedos.get(e.pointerId); if (!d) return;
    if (dedos.size === 1) { st.x += e.clientX - d.x; st.y += e.clientY - d.y; d.x = e.clientX; d.y = e.clientY; st.colocar(); }
    else { d.x = e.clientX; d.y = e.clientY; const p = Array.from(dedos.values()), dd = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y); if (dist0) st.acercar(zoom0 * dd / dist0); }
  });
  const soltar = function (e) { dedos.delete(e.pointerId); };
  marco.addEventListener('pointerup', soltar); marco.addEventListener('pointercancel', soltar);
  marco.addEventListener('wheel', function (e) { e.preventDefault(); st.acercar(st.zoom * (e.deltaY < 0 ? 1.08 : 1 / 1.08)); }, { passive: false });
}

    const sc = $('#esc-scroll'), sel = getSelection(); if (!sc || !sel || !sel.rangeCount) return;

// Sube reseñas "crudas" (de la versión anterior o de un respaldo) a la nube, como privadas.
async function subirALaNube(crudos) {
  const uid = estado.sesion.id, hechos = [];
  let fallos = 0;
  for (let i = 0; i < crudos.length; i++) {
    const raw = crudos[i], id = nuevoId(), subidas = [];
    toast('Subiendo ' + (i + 1) + ' de ' + crudos.length + '…');
    try {
      let fp = null, tp = null;
      if (typeof raw.foto === 'string' && raw.foto.indexOf('data:image/') === 0) {
        const fotos = await procesarFoto(await (await fetch(raw.foto)).blob());
        const sello = Date.now().toString(36);
        fp = uid + '/' + id + '/' + sello + '-g.jpg'; tp = uid + '/' + id + '/' + sello + '-m.jpg';
        await subirFoto(fp, fotos.full); subidas.push(fp);
        await subirFoto(tp, fotos.thumb); subidas.push(tp);
      }
      const d = normalizar(Object.assign({}, raw, { id: id, foto: null, thumb: null }));
      const r = await sb.from('reviews').insert({
        id: id, titulo: d.titulo, categoria: d.categoria, generos: d.generos, fecha: d.fecha, descripcion: d.descripcion,
        nota: d.nota, veredicto: d.veredicto, resenia: limpiar(d.resenia), foto_path: fp, thumb_path: tp, publica: false
      });
      if (r.error) throw r.error;
      const coms = (raw.comentarios || []).filter(c => c && typeof c.texto === 'string' && c.texto.trim().length >= MIN_COMENTARIO)
        .map(c => ({ review_id: id, texto: c.texto.trim().slice(0, 5000) }));
      if (coms.length) await sb.from('comments').insert(coms);
      hechos.push(raw);
    } catch (e) {
      console.error(e); fallos++;
      if (subidas.length) sb.storage.from(BUCKET).remove(subidas);
    }
  }
  return { hechos: hechos, fallos: fallos };
}

      break;
    case 'borrar-com':
      seguro(async function () {
        const r = await sb.from('comments').delete().eq('id', b.dataset.cid);
        if (r.error) throw r.error;
        await cargarComentarios(id);
        pintarComentarios(porId(id));
      }, 'No se pudo borrar el comentario.');
      break;
    case 'migrar':
      b.disabled = true;
      seguro(migrarLocales, 'No se pudieron subir las reseñas.').then(function () { b.disabled = false; });
      break;
    case 'ed-cat': if (estado.ed.categoria !== b.dataset.cat) { estado.ed.categoria = b.dataset.cat; estado.ed.generos = []; $('#chips-cat').innerHTML = chipsCategoria(); $('#chips-gen').innerHTML = chipsGeneros(); aplicarCategoria(); } break;
    case 'ed-gen': { const g = b.dataset.g, i = estado.ed.generos.indexOf(g); if (i >= 0) estado.ed.generos.splice(i, 1); else estado.ed.generos.push(g); $('#chips-gen').innerHTML = chipsGeneros(); break; }
    case 'ed-gen-add': addGenero(); break;
    case 'ed-vis': estado.ed.publica = b.dataset.v === '1'; $('#vis').innerHTML = visHTML(); break;
    case 'ed-quitar-foto': estado.ed.foto = null; estado.ed.nuevaFoto = null; estado.ed.vistaThumb = null; pintarFoto(); break;
    case 'ed-nota-set': cambiarNota(parseInt(b.dataset.n, 10)); break;
    case 'ed-nota-mas': cambiarNota(estado.ed.nota + 0.1); break;
    case 'ed-nota-menos': cambiarNota(estado.ed.nota - 0.1); break;
    case 'ed-fmt': formato(b.dataset.cmd); break;
    case 'exportar': exportar(); break;
    case 'sem-filtro': estado.semTipo = b.dataset.t || ''; render(false); break;
    case 'sem-nota-abrir': estado.sem.abierta = true; if (estado.sem.nota == null) estado.sem.nota = 3; marcarSem(); pintarSecNota(); break;
    case 'sem-nota-quitar': estado.sem.nota = null; estado.sem.abierta = false; marcarSem(); pintarSecNota(); break;
    case 'sem-nota-set': cambiarNotaSem(parseInt(b.dataset.n, 10)); break;
    case 'sem-nota-mas': cambiarNotaSem((estado.sem.nota == null ? 3 : estado.sem.nota) + 0.1); break;
    case 'sem-nota-menos': cambiarNotaSem((estado.sem.nota == null ? 3 : estado.sem.nota) - 0.1); break;
    case 'sem-vis': estado.sem.publica = b.dataset.v === '1'; marcarSem(); $('#s-vis').innerHTML = visSemHTML(); break;
    case 'sem-descartar': { const s0 = estado.sem; Copia.borrar(claveSemBor(s0)); estado.sem = null; render(true); break; }
    case 'sem-borrar': {
      if (!b.classList.contains('sure')) { b.classList.add('sure'); b.textContent = 'Toca otra vez para borrar'; setTimeout(function () { b.classList.remove('sure'); b.textContent = 'Borrar'; }, 4000); break; }
      const s0 = estado.sem; if (!s0 || !s0.base) break;
      b.disabled = true;
      viento(semTexto(s0.base), function () { return borrarSemilla(s0.id); }).then(function () {
        Copia.borrar(claveSemBor(s0)); estado.sem = null; toast('Semilla borrada'); location.hash = '#diario';
      }, function (er) { console.error(er); b.disabled = false; toast('No se pudo borrar. Revisa tu internet e intenta otra vez.'); });
      break;
    }
  }
});

// Los botones de formato no deben quitarle el cursor a la reseña.
document.addEventListener('mousedown', function (e) { if (e.target.closest('.tb')) e.preventDefault(); });
document.addEventListener('focusin', function (e) {
  if (e.target && e.target.id === 'f-resenia') { try { document.execCommand('defaultParagraphSeparator', false, 'p'); } catch (x) { /* nada */ } prepararTexto(e.target); contarPalabras(); }
});

document.addEventListener('input', function (e) {
  const t = e.target;
  if (t.id === 'q') { estado.q = t.value; pintarGrid(); }
  else if (t.id === 'com-texto') {
    const n = t.value.trim().length;
    $('#com-cont').textContent = n + ' / ' + MIN_COMENTARIO;
    $('#com-cont').classList.toggle('ok', n >= MIN_COMENTARIO);
    $('#com-btn').disabled = n < MIN_COMENTARIO;
  }
  else if (t.id === 'f-titulo') { const er = $('#f-error'); if (er) er.hidden = true; pintarEyebrow(); }
  else if (t.id === 'f-fecha') { pintarEyebrow(); }
  else if (t.id === 'f-veredicto') { const nc = $('#nombre-cont'); if (nc) nc.textContent = t.value.length + ' / 120'; }
  else if (t.id === 'enc-zoom') { if (estado.enc) estado.enc.acercar(parseFloat(t.value)); return; }
  else if (t.id === 'gen-q') { filtrarGeneros(t.value); return; }
  else if (t.id === 'f-resenia') {
    if (!t.textContent.trim() && !t.querySelector('li,blockquote,h2,h3') && !/^<p><br><\/p>$/.test(t.innerHTML.trim())) prepararTexto(t);
    t.classList.toggle('rte-vacio', !t.textContent.trim() && !t.querySelector('li,blockquote,h2,h3'));
    contarPalabras(); mantenerCursor();
  }
  else if (t.id === 's-texto') { estado.sem.contenido = t.value; autoTam(t); contarSem(); const er = $('#s-error'); if (er) er.hidden = true; marcarSem(); }
  else if (t.id === 's-titulo') { estado.sem.titulo = t.value; const er = $('#s-error'); if (er) er.hidden = true; marcarSem(); }
  else if (t.classList && t.classList.contains('nw-rango')) {
    const v = parseFloat(t.value);
    if (t.dataset.pfx === 'sem' && estado.sem) cambiarNotaSem(v, true);
    else if (estado.ed) cambiarNota(v, true);
  }
  if (t.id === 'f-resenia' || (t.closest && t.closest('#f'))) marcar();
});

document.addEventListener('change', function (e) {
  const t = e.target;
  if (t.id === 'orden') { estado.orden = t.value; pintarGrid(); }
  else if (t.id === 'top-cat') { estado.topCat = t.value; estado.topGen = 'todos'; render(false); }
  else if (t.id === 'top-gen') { estado.topGen = t.value; render(false); }
  else if (t.id === 'foto' && t.files && t.files[0]) { const ar = t.files[0]; t.value = ''; elegirFoto(ar); }
  else if (t.id === 'f-importar' && t.files && t.files[0]) { importar(t.files[0]); t.value = ''; }
  else if (t.id === 'clave-ver') { ['#clave-1', '#clave-2'].forEach(function (q) { const i = $(q); if (i) i.type = t.checked ? 'text' : 'password'; }); }
});

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') {
    if ($('#hoja-enc')) { estado.enc = null; cerrarHoja('hoja-enc'); return; }
    if ($('#hoja-gen')) { cerrarHoja('hoja-gen'); return; }
    if (escAbierto()) { salirEscritura(); return; }
  }
  if ((e.key === 'Enter' || e.key === ' ') && document.querySelector('.bienvenida')) { e.preventDefault(); entrarApp(); return; }
  if (e.key === 'Enter' && e.target.matches && e.target.matches('#f input')) {
    e.preventDefault();
    if (e.target.id === 'f-gen-nuevo') addGenero();
    else if (e.target.id === 'f-veredicto') { const r = $('#f-resenia'); if (r) { prepararTexto(r); r.focus(); cursorAlFinal(r); } }
  }
});

function ajustarImgDetalle(i) {
  const p = i.closest('.d-poster'), h = i.closest('.d-hero'); if (!p || !h || !i.naturalWidth) return;
  p.classList.add('ya');
  h.classList.toggle('ancha', i.naturalWidth > i.naturalHeight * 1.12);
}
document.addEventListener('load', function (e) { const i = e.target; if (i && i.classList && i.classList.contains('d-img')) ajustarImgDetalle(i); }, true);

document.addEventListener('submit', function (e) {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'f') { guardarFormulario(); }
  else if (f.id === 'fs') { guardarSemilla(); }
  else if (f.id === 'flogin') {
    const err = $('#login-error'), btn = $('#login-btn');
    const email = $('#login-email').value.trim(), clave = $('#login-clave').value;
    err.hidden = true;
    if (!email || !clave) { err.textContent = 'Escribe tu correo y tu contraseña.'; err.hidden = false; return; }
    if (!sb) { err.textContent = 'No pude conectar con la nube. Revisa tu internet y recarga la página.'; err.hidden = false; return; }
    btn.disabled = true; btn.textContent = 'Entrando…';
    estado.entrando = true;
    iniciarSesion(email, clave).then(function () { location.hash = '#inicio'; }).catch(function (er) {
      estado.entrando = false;
      err.textContent = (er && /invalid|credentials/i.test(er.message || '')) ? 'Correo o contraseña incorrectos.' : 'No pude conectar. Revisa tu internet e intenta otra vez.';
      err.hidden = false; btn.disabled = false; btn.textContent = 'Entrar';
    });
  }
  else if (f.id === 'folvide') {
    const err = $('#olvide-error'), btn = $('#olvide-btn'), email = $('#olvide-email').value.trim();
    err.hidden = true;
    if (email.indexOf('@') < 1) { err.textContent = 'Escribe tu correo.'; err.hidden = false; return; }
    if (!sb) { err.textContent = 'No pude conectar con la nube. Revisa tu internet y recarga la página.'; err.hidden = false; return; }
    estado.emailOlvide = email; btn.disabled = true; btn.textContent = 'Enviando…';
    sb.auth.resetPasswordForEmail(email, { redirectTo: SITIO }).then(function (r) {
      if (r.error) throw r.error;
      avisoLink = ''; estado.olvideEnviado = true; render(false);
    }).catch(function (er) {
      const m = String((er && er.message) || '');
      err.textContent = ((er && er.status === 429) || /rate|too many|seconds|after/i.test(m)) ? 'Pediste varios correos seguidos. Espera unos minutos e intenta otra vez.' : 'No pude enviar el correo. Revisa tu internet e intenta otra vez.';
      err.hidden = false; btn.disabled = false; btn.textContent = 'Enviarme el link';
    });
  }
  else if (f.id === 'fclave') {
    const err = $('#clave-error'), btn = $('#clave-btn'), a = $('#clave-1').value, b2 = $('#clave-2').value;
    err.hidden = true;
    const mal = t => { err.textContent = t; err.hidden = false; };
    if (a.length < 8) { mal('Escribe mínimo 8 caracteres.'); return; }
    if (a !== b2) { mal('Las dos contraseñas no son iguales.'); return; }
    if (!sb || !estado.sesion) { mal('Esta pantalla necesita el link del correo. Pídelo otra vez.'); return; }
    btn.disabled = true; btn.textContent = 'Guardando…';
    sb.auth.updateUser({ password: a }).then(function (r) {
      if (r.error) throw r.error;
      recuperando = false; toast('Contraseña cambiada'); location.hash = '#inicio';
    }).catch(function (er) {
      const m = String((er && er.message) || '');
      mal(/same|different/i.test(m) ? 'Esa es la misma contraseña de antes. Elige otra.' : /weak|short|least|characters/i.test(m) ? 'Esa contraseña es muy débil. Prueba con más letras y números.' : 'No se pudo cambiar. Revisa tu internet; si el link venció, pide otro.');
      btn.disabled = false; btn.textContent = 'Guardar contraseña';
    });
  }
  else if (f.id === 'fcom') {
    const id = f.dataset.id, txt = $('#com-texto').value.trim();
    if (txt.length < MIN_COMENTARIO || !estado.sesion || !sb) return;
    $('#com-btn').disabled = true;
    (async function () {
      try {
        const r = await sb.from('comments').insert({ review_id: id, texto: txt });
        if (r.error) throw r.error;
        await cargarComentarios(id);
        const ta = $('#com-texto'); if (ta) { ta.value = ''; $('#com-cont').textContent = '0 / ' + MIN_COMENTARIO; $('#com-cont').classList.remove('ok'); }
        pintarComentarios(porId(id));
        toast('Comentario publicado');
      } catch (er) { console.error(er); toast('No se pudo publicar el comentario.'); const bt = $('#com-btn'); if (bt) bt.disabled = false; }
    })();
  }
});

window.addEventListener('hashchange', function () { bvPendiente = false; render(true); });
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && e.target && e.target.id === 's-titulo') { e.preventDefault(); const x = $('#s-texto'); if (x) x.focus(); }
});
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden' && estado.sem && estado.sem.tocado) flushSem(); });
window.addEventListener('pagehide', function () { if (estado.sem && estado.sem.tocado) flushSem(); });
window.addEventListener('popstate', function () { if (estado.escHist) { estado.escHist = false; cerrarEscritura(); } });
if (window.visualViewport) {
  visualViewport.addEventListener('resize', function () { ajustarVV(); setTimeout(mantenerCursor, 60); });
  visualViewport.addEventListener('scroll', ajustarVV);
}
// Al pegar texto se pega limpio, sin la letra ni los colores de donde venga.
document.addEventListener('paste', function (e) {
  if (!e.target || e.target.id !== 'f-resenia') return;
  e.preventDefault();
  const txt = String((e.clipboardData || window.clipboardData).getData('text/plain') || '').replace(/\r/g, '');
  const partes = txt.split(/\n{2,}/);
  if (partes.length === 1) document.execCommand('insertText', false, txt);
  else document.execCommand('insertHTML', false, partes.map(p => '<p>' + esc(p).replace(/\n/g, '<br>') + '</p>').join(''));
});
// Los botones de formato se iluminan según dónde esté el cursor.
document.addEventListener('selectionchange', function () {
  if (document.activeElement !== $('#f-resenia')) return;
  const e = $('#escritorio'); if (!e) return;
  const est = c => { try { return document.queryCommandState(c); } catch (x) { return false; } };
  let bloque = ''; try { bloque = String(document.queryCommandValue('formatBlock') || '').toLowerCase(); } catch (x) { /* nada */ }
  const m = { bold: est('bold'), italic: est('italic'), list: est('insertUnorderedList'), olist: est('insertOrderedList'), h2: bloque === 'h2', h3: bloque === 'h3', quote: bloque === 'blockquote' };
  e.querySelectorAll('.tb[data-cmd]').forEach(function (b) { if (b.dataset.cmd in m) b.setAttribute('aria-pressed', !!m[b.dataset.cmd]); });
});
// Si se cierra la app o se cambia de pestaña, lo escrito se guarda.
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden' && estado.ed && estado.ed.tocado) flushBorrador(); });
window.addEventListener('pagehide', function () { if (estado.ed && estado.ed.tocado) flushBorrador(); });

/* =====================================================================
   8. ARRANQUE
   ===================================================================== */
(async function iniciar() {
  const dfs = document.getElementById('aq-defs'); if (dfs) dfs.innerHTML = AQ_DEFS + LOGO_DEFS;
  await Copia.abrir();
  const hay = iniciarCliente();
  render(false);
  if (!hay) { await alCambiarSesion(null, true); return; }
  sb.auth.onAuthStateChange(function (evento, ses) {
    if (evento === 'PASSWORD_RECOVERY') {   // abrió el link del correo: directo a elegir la contraseña nueva
      recuperando = true; bvPendiente = false; bvDestino = ''; detenerBienvenida();
      if (location.hash === '#nueva-clave') setTimeout(function () { render(true); }, 0); else location.hash = '#nueva-clave';
    }
    // Se pospone un instante para no pedir cosas a Supabase dentro de su propio aviso.
    setTimeout(function () { alCambiarSesion(ses ? ses.user : null, evento === 'INITIAL_SESSION'); }, 0);
  });
  setTimeout(function () { if (!estado.iniciado) alCambiarSesion(null, true); }, 3000);
})();

})();
</script>

if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
